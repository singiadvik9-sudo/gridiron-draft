<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4th and Pixels</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout concept: a night-game broadcast. Dark stadium ground, chalk-white type,
   coral vs blue team colors, a yellow first-down-line accent used for the one primary action. */
:root {
  color-scheme: dark;
  --ink: #0b1020;
  --panel: #121a30;
  --panel2: #1a2442;
  --line: #2b3860;
  --chalk: #efe9d6;
  --mute: #93a0c4;
  --flag: #ffcf3f;
  --ta: #ff6b4a;
  --tb: #4aa8ff;
  --good: #5fd38d;
  --bad: #ff6b6b;
  --display: 'Silkscreen', 'Courier New', monospace;
  --body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--chalk);
  font-family: var(--body); font-size: 18px; line-height: 1.3;
  padding-inline: 16px; padding-block: 14px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
canvas.spr { image-rendering: pixelated; display: block; }

/* header */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 3px solid var(--line); position: relative; }
.mast::after { content: ''; position: absolute; left: 0; bottom: -3px; width: 96px; height: 3px; background: var(--flag); }
.brand { font-family: var(--display); font-size: clamp(22px, 5vw, 34px); letter-spacing: .04em; font-weight: 700; text-transform: uppercase; }
.brand span { color: var(--flag); }
#hdr-right { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-block; font-family: var(--display); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border: 2px solid var(--line); border-radius: 2px; color: var(--chalk); background: var(--panel); }
.chip[style*="--tc"] { border-color: var(--tc); color: var(--tc); }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.room { border-color: var(--flag); color: var(--flag); }
.trait { font-size: 12px; color: var(--mute); line-height: 1.15; margin-top: 3px; }

/* buttons */
.btn { font-family: var(--display); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 16px; background: var(--panel2); color: var(--chalk); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 2px; }
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--flag); color: #1a1405; border-color: #a67d00; }
.btn.primary:hover:not(:disabled) { border-color: #ffe27a; }
.btn.small { font-size: 11px; padding: 8px 10px; border-bottom-width: 4px; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* shared */
.panel { background: var(--panel); border: 2px solid var(--line); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-family: var(--display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.sub { color: var(--mute); font-size: 19px; max-width: 62ch; }
.hint { color: var(--mute); font-size: 16px; }
.eyebrow { font-family: var(--display); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.fld { font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: block; }
input[type=text] { font: inherit; font-size: 20px; width: 100%; padding: 10px 12px; background: var(--ink); color: var(--chalk); border: 2px solid var(--line); border-radius: 2px; min-width: 0; }
input[type=text]::placeholder { color: #5b6890; }
.grade { font-family: var(--display); font-size: 13px; display: inline-grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--line); background: var(--ink); }
.grade.g-S, .g-S .grade { border-color: var(--flag); color: var(--flag); }
.grade.g-A, .g-A .grade { border-color: var(--good); color: var(--good); }
.grade.g-B, .g-B .grade { border-color: var(--tb); color: var(--tb); }
.grade.g-C, .g-C .grade { color: var(--mute); }
.grade.g-D, .g-D .grade { border-color: var(--bad); color: var(--bad); }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.hero { grid-column: 1 / -1; display: grid; gap: 14px; padding-block: 8px 4px; }
.lineup { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; padding: 14px; background: repeating-linear-gradient(90deg, #1f5233 0 48px, #245c3a 48px 96px); border: 2px solid var(--line); }
.lineup canvas { width: 70px; height: 70px; }
.lede { font-family: var(--display); font-size: clamp(16px, 3.4vw, 24px); line-height: 1.35; text-wrap: balance; }
.join-panel { align-self: stretch; }
.joinrow input { flex: 1 1 140px; letter-spacing: .25em; font-family: var(--display); font-size: 18px; text-transform: uppercase; }
.or { display: flex; align-items: center; gap: 10px; color: var(--mute); font-family: var(--display); font-size: 11px; text-transform: uppercase; }
.or::before, .or::after { content: ''; flex: 1; height: 2px; background: var(--line); }
.how ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; color: var(--mute); }
.how li b { color: var(--chalk); }

/* draft */
.draft { display: grid; gap: 16px; }
.dr-head { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.dr-round { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dr-round b { font-family: var(--display); font-size: 34px; color: var(--flag); line-height: 1; }
.dr-round .of { color: var(--mute); font-family: var(--display); font-size: 12px; }
.dr-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dr-title h2 { font-family: var(--display); font-size: clamp(14px, 3vw, 20px); text-transform: uppercase; letter-spacing: .04em; }
.pos-tag { font-family: var(--display); background: var(--flag); color: #1a1405; padding: 5px 8px; font-size: 13px; }
.dr-ovr { display: grid; justify-items: end; gap: 2px; }
.dr-ovr b { font-family: var(--display); font-size: 28px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.pcard { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 12px; background: var(--panel); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 2px; min-width: 0; }
.pcard:hover { border-color: var(--flag); transform: translateY(-2px); }
.pcard:active { transform: translateY(1px); }
.pc-art { position: relative; display: grid; place-items: center; padding: 10px; background: repeating-linear-gradient(90deg, #1f5233 0 32px, #245c3a 32px 64px); min-height: 116px; }
.pc-art canvas { width: 98px; height: 98px; }
.pc-art .grade { position: absolute; top: 6px; right: 6px; }
.pc-main { display: grid; gap: 8px; min-width: 0; flex: 1; }
.pc-top { display: flex; align-items: center; gap: 8px; }
.key { font-family: var(--display); font-size: 11px; width: 22px; height: 22px; display: inline-grid; place-items: center; background: var(--panel2); border: 2px solid var(--line); flex: none; }
.pc-name { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dex { color: var(--mute); font-family: var(--display); font-size: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; gap: 4px; }
.st { display: grid; grid-template-columns: 34px 1fr 28px; gap: 8px; align-items: center; font-family: var(--display); font-size: 10px; color: var(--mute); }
.st b { color: var(--chalk); font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--ink); display: block; }
.bar i { display: block; height: 100%; }
.bar i.hi { background: var(--good); }
.bar i.mid { background: var(--tb); }
.bar i.lo { background: #6b7799; }
.fit { display: flex; align-items: center; gap: 8px; padding-top: 4px; border-top: 2px solid var(--line); }
.fit .lbl { font-family: var(--display); font-size: 10px; color: var(--mute); }
.fit b { font-family: var(--display); font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.meter { display: flex; gap: 2px; flex: 1; }
.meter i { height: 10px; flex: 1; background: var(--ink); }
.meter i.on { background: var(--flag); }
.dr-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.keys { color: var(--mute); font-size: 16px; }
.dr-actions .ghost { margin-left: auto; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.slot { display: grid; justify-items: center; gap: 2px; padding: 4px 2px; background: var(--panel); border: 2px solid var(--line); min-height: 52px; }
.slot.cur { border-color: var(--flag); }
.slot.done { background: var(--panel2); }
.s-lbl { font-family: var(--display); font-size: 9px; color: var(--mute); }
.slot canvas { width: 28px; height: 28px; }
.slot .empty { width: 24px; height: 24px; display: block; }

/* setup + review + wait */
.setup, .review, .wait { max-width: 720px; margin: 0 auto; width: 100%; }
.forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.segs { display: flex; margin-block: 8px; }
.seg { flex: 1; font-family: var(--display); font-size: 13px; padding: 12px 8px; background: var(--ink); border: 2px solid var(--line); color: var(--mute); text-transform: uppercase; }
.seg + .seg { border-left: 0; }
.seg.on { background: var(--flag); color: #1a1405; border-color: #a67d00; }
.ratings { display: flex; gap: 12px; flex-wrap: wrap; }
.ratings > div { flex: 1 1 90px; display: grid; gap: 2px; padding: 10px 12px; background: var(--ink); border: 2px solid var(--line); }
.ratings b { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.ratings.small b { font-size: 18px; }
.ratings.small > div { padding: 6px 10px; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.roster li { display: grid; grid-template-columns: 38px 24px minmax(0, 1fr) auto 28px 24px; gap: 8px; align-items: center; padding: 3px 6px; background: var(--ink); }
.r-pos { font-family: var(--display); font-size: 10px; color: var(--mute); }
.roster canvas { width: 28px; height: 28px; }
.r-name { font-family: var(--display); font-size: 12px; text-transform: uppercase; overflow-wrap: anywhere; }
.r-type { font-family: var(--display); font-size: 9px; color: var(--tc); text-transform: uppercase; }
.r-fit { font-family: var(--display); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.roster .grade { width: 22px; height: 22px; font-size: 11px; }
.bigcode { font-family: var(--display); font-size: clamp(38px, 12vw, 72px); letter-spacing: .18em; color: var(--flag); line-height: 1; padding-block: 4px; }
.seats { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.seats li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--ink); border: 2px solid var(--line); color: var(--mute); }
.seats li.ok { border-color: var(--good); }
.seats li b { color: var(--chalk); font-weight: 600; font-size: 20px; overflow-wrap: anywhere; }
.dot { width: 12px; height: 12px; display: block; }

/* game */
.game { display: grid; gap: 14px; }
.sb { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.sb-team { display: grid; gap: 4px; padding: 10px 14px; background: var(--panel); border: 2px solid var(--line); border-top-width: 6px; align-content: center; min-width: 0; }
.sb-team.a { border-top-color: var(--ta); }
.sb-team.b { border-top-color: var(--tb); text-align: right; }
.sb-team.has { background: var(--panel2); }
.sb-team.has .sb-name::before { content: '◆ '; color: var(--flag); }
.sb-team.b.has .sb-name::before { content: ''; }
.sb-team.b.has .sb-name::after { content: ' ◆'; color: var(--flag); }
.sb-name { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.sb-score { font-family: var(--display); font-size: clamp(30px, 7vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
.sb-mid { display: grid; gap: 4px; justify-items: center; align-content: center; padding: 8px 14px; background: var(--ink); border: 2px solid var(--line); text-align: center; min-width: 120px; }
.sb-q { font-family: var(--display); font-size: 12px; color: var(--flag); }
.sb-dd { font-family: var(--display); font-size: 16px; }
.sb-ball { color: var(--mute); font-size: 16px; }
.fieldhost { border: 3px solid var(--line); background: #0e1528; line-height: 0; }
canvas.field { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.deck { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cp-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.role { font-family: var(--display); font-size: 12px; text-transform: uppercase; padding: 5px 8px; letter-spacing: .05em; }
.role.off { background: var(--flag); color: #1a1405; }
.role.def { background: var(--tb); color: #07162a; }
.sit { font-family: var(--display); font-size: 12px; color: var(--mute); }
.calls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.call { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; row-gap: 2px; text-align: left; padding: 10px; background: var(--panel2); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 2px; align-content: start; min-width: 0; }
.call:hover:not(:disabled) { border-color: var(--flag); }
.call:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.call:disabled { opacity: .4; cursor: not-allowed; }
.call .key { grid-row: span 2; }
.call b { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; font-weight: 400; }
.call small { color: var(--mute); font-size: 15px; line-height: 1.2; grid-column: 2; }
.call em { grid-column: 2; font-style: normal; font-family: var(--display); font-size: 10px; color: var(--flag); }
.locked { display: grid; gap: 6px; padding: 16px; background: var(--ink); border: 2px dashed var(--line); }
.locked b { font-family: var(--display); font-size: 20px; text-transform: uppercase; color: var(--flag); font-weight: 400; }
.side { display: grid; gap: 12px; min-width: 0; }
.banner { padding: 12px 14px; background: var(--panel); border: 2px solid var(--line); border-left: 8px solid var(--bc, var(--line)); display: grid; gap: 4px; }
.bn-meta { font-family: var(--display); font-size: 10px; letter-spacing: .06em; color: var(--mute); text-transform: uppercase; }
.bn-text { font-size: 21px; line-height: 1.2; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 5px 8px; background: var(--panel); font-size: 16px; line-height: 1.2; }
.log li.ev-td, .log li.ev-fg, .log li.ev-safety { background: var(--panel2); }
.lg-n { font-family: var(--display); font-size: 10px; padding-top: 3px; }
.final { display: grid; gap: 14px; text-align: center; justify-items: center; padding-block: 10px; }
.final h2 { font-size: clamp(24px, 6vw, 40px); color: var(--flag); }
.fscore { display: grid; gap: 6px; font-family: var(--display); font-size: 14px; text-transform: uppercase; }
.fscore b { font-size: 26px; margin-left: 8px; }

/* modal + toast */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.m-back { position: absolute; inset: 0; background: rgba(5, 8, 18, .8); }
.m-card { position: relative; background: var(--panel); border: 2px solid var(--line); padding: 18px; max-width: 920px; width: 100%; max-height: 88vh; overflow-y: auto; display: grid; gap: 14px; }
.m-card h3 { font-family: var(--display); font-size: 15px; text-transform: uppercase; }
.rcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rcol { display: grid; gap: 10px; align-content: start; min-width: 0; }
.rcol.a h3 { color: var(--ta); }
.rcol.b h3 { color: var(--tb); }
.tbl-wrap { overflow-x: auto; }
.mt { border-collapse: collapse; width: 100%; min-width: 520px; }
.mt th, .mt td { padding: 8px; border: 2px solid var(--line); text-align: center; font-size: 16px; }
.mt thead th { font-family: var(--display); font-size: 10px; text-transform: uppercase; color: var(--mute); }
.mt tbody th { text-align: left; font-family: var(--display); font-size: 11px; text-transform: uppercase; }
.mt td { font-family: var(--display); font-size: 14px; }
.mt .good2 { background: rgba(95, 211, 141, .35); } .mt .good1 { background: rgba(95, 211, 141, .15); }
.mt .bad2 { background: rgba(255, 107, 107, .35); } .mt .bad1 { background: rgba(255, 107, 107, .15); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: #10152a; padding: 12px 16px; font-size: 18px; font-weight: 600; max-width: min(92vw, 520px); z-index: 30; border-bottom: 5px solid var(--flag); }
.toast[hidden] { display: none; }

/* narrow screens */
@media (max-width: 760px) {
  .lobby { grid-template-columns: minmax(0, 1fr); }
  .deck { grid-template-columns: minmax(0, 1fr); }
  .rcols { grid-template-columns: minmax(0, 1fr); }
  .dr-head { grid-template-columns: auto 1fr; }
  .dr-ovr { display: none; }
}
@media (max-width: 640px) {
  .cards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pcard { flex-direction: row; gap: 12px; }
  .pc-art { min-height: 0; align-self: flex-start; padding: 6px; }
  .pc-art canvas { width: 70px; height: 70px; }
  .sb { grid-template-columns: 1fr 1fr; }
  .sb-mid { grid-column: 1 / -1; order: -1; grid-auto-flow: column; justify-content: space-between; min-width: 0; }
  .roster li { grid-template-columns: 34px 24px minmax(0, 1fr) 26px 22px; }
  .r-type { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pcard, .btn, .call { transition: none; }
  .pcard:hover { transform: none; }
}

/* gridiron additions */
.pc-art.units { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; align-content: center; }
.pc-art.units canvas { width: 42px; height: 42px; }
.plist { display: grid; gap: 1px; font-size: 14px; color: var(--mute); }
.plist div { display: flex; justify-content: space-between; gap: 8px; }
.plist b { color: var(--chalk); font-weight: 600; }
.chip.tm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dex { font-family: var(--display); font-size: 18px; color: var(--chalk); }
@media (max-width: 640px) { .pc-art.units canvas { width: 28px; height: 28px; } }

/* ---------- hub: menus, franchise screens, leagues, tournaments ---------- */
.mast { align-items: center; }
#hdr-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 4px; }
.tile { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; align-content: start; min-height: 130px; }
.tile:hover { border-color: var(--flag); background: var(--panel2); }
.tile b { font-family: var(--display); font-size: 17px; letter-spacing: .04em; color: var(--flag); }
.tile span { color: var(--chalk); font-size: 17px; }
.lockt { font-style: normal; font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
.panel.narrow { max-width: 560px; margin-inline: auto; width: 100%; }
.panel h3 { font-family: var(--display); font-size: 14px; letter-spacing: .05em; margin-bottom: 8px; }
.row.between { justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.sub.bad, .bad { color: var(--bad); }
select, input[type=number], input[type=password] { background: var(--ink); color: var(--chalk); border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; max-width: 100%; }
input[type=password] { width: 100%; }
select:focus, input:focus { border-color: var(--flag); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.segs { display: flex; flex-wrap: wrap; gap: 0; margin: 4px 0 8px; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 16px; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.addrow input[type=text], .addrow select { flex: 1 1 200px; }
.lglist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
.lglist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.lglist li div { display: grid; }

  const pk = kind === 'WR' ? 'WR' : kind;

  const pick = () => pool.splice(Math.floor(rnd() * pool.length), 1)[0];
  const opts = [pick(), pick(), pick()];
  const floor = isU ? 80 : 78;
  for (let t = 0; t < 6 && Math.max.apply(null, opts.map(c => c.ovr)) < floor; t++) opts[Math.floor(rnd() * 3)] = pick();

  SLOTS.forEach((s, i) => {

    } else if (lv.k === 'inc') {
      const rec = lv.tgt ? nm(o, lv.tgt) : null; entry.qbId = 'QB'; if (lv.tgt) entry.recId = lv.tgt;
      entry.anim = 'inc'; entry.travel = Math.max(2, Math.round(lv.x)); entry.ev = 'inc';
      s.toGo = st.toGo; s.down = st.down + 1; s.ballOn = st.ballOn;
      if (lv.away || !rec) entry.text = qb + ' throws it away.';
      else if (lv.pbu) { entry.defId = lv.pbu; entry.text = qb + "'s pass for " + rec + ' is broken up by ' + nm(d, lv.pbu) + '.'; }
      else if (lv.drop) entry.text = rec + ' drops the pass from ' + qb + '.';
      else entry.text = qb + "'s pass for " + rec + ' falls incomplete.';
      if (s.down > 4) { giveBall(d, 100 - st.ballOn); entry.ev = 'downs'; entry.text += ' Turnover on downs.'; }
    } else if (lv.k === 'int') {
      const who = nm(d, lv.by); entry.defId = lv.by; entry.qbId = 'QB'; entry.anim = 'int'; entry.ev = 'int'; entry.travel = Math.max(2, Math.round(lv.x));
      const spot = st.ballOn + lv.x;
      if (lv.tdRet) entry.text = scoreTD(d, qb + ' is picked off by ' + who + ', who takes it all the way back!');
      else if (spot >= 100) { giveBall(d, 20); entry.text = qb + ' is picked off in the end zone by ' + who + '. Touchback.'; }
      else { giveBall(d, 100 - (st.ballOn + clamp(lv.retX == null ? lv.x : lv.retX, -st.ballOn + 1, 99 - st.ballOn))); entry.text = qb + ' is picked off by ' + who + '.'; }
    } else if (lv.k === 'fumble') {

      const y = lv.sack ? Math.min(0, clampY(lv.x)) : Math.max(0, clampY(lv.x)); entry.yards = y; entry.travel = y;
      const forcer = lv.by ? nm(d, lv.by) : 'the defense';
      if (lv.sack) { entry.anim = 'sack'; entry.qbId = 'QB'; entry.sacked = 1; entry.text = forcer + ' sacks ' + runner + ' and strips the ball! ' + teams[d].name + ' recover the fumble.'; }
      else if (lv.pass) { entry.anim = 'pass'; entry.qbId = 'QB'; entry.recId = lv.who; entry.text = qb + ' finds ' + runner + ', but ' + forcer + ' knocks it loose and ' + teams[d].name + ' recover.'; }
      else { entry.anim = 'run'; entry.runId = lv.who; entry.text = runner + ' fumbles, forced out by ' + forcer + ', and ' + teams[d].name + ' recover.'; }
      giveBall(d, 100 - Math.max(1, Math.min(st.ballOn + y, 98)));
    } else if (lv.k === 'safety') {
      entry.yards = -st.ballOn; entry.travel = -st.ballOn; entry.ev = 'safety'; entry.anim = 'run';

    } else { // 'run' or 'pass': the ball carrier was brought down (or scored)

      const passed = lv.k === 'pass';

        entry.anim = 'pass'; entry.qbId = 'QB'; entry.recId = lv.who;

      } else {
        entry.anim = 'run'; entry.runId = lv.who;
        desc = y <= 0 ? (y === 0 ? who + ' is stuffed for no gain.' : who + ' is dropped for a loss of ' + yds(y) + '.')
             : y >= 15 ? who + ' breaks free for ' + yds(y) + '.' : lv.who === 'QB' ? who + ' scrambles for ' + yds(y) + '.' : who + ' runs for ' + yds(y) + '.';
      }
      if (lv.fum && !lv.td) { entry.fum = 'kept'; entry.defId = lv.fum; desc += ' The ball comes loose but ' + who + ' falls on it.'; }

      entry.travel = y;
      let desc;
      if (y <= 0) desc = y === 0 ? runner + ' is stuffed for no gain.' : runner + ' is dropped for a loss of ' + yds(y) + '.';
      else if (y >= 15) desc = runner + ' breaks free for ' + yds(y) + '.';
      else desc = runner + ' runs for ' + yds(y) + '.';

    const m = matchup(defPick, offPick), eff = 1 + 0.30 * m;

    const cov = 0.45 * DU.cb + 0.30 * DU.s + 0.25 * DU.lb;

  // clock + quarters
  s.playNo = st.playNo + 1;
  const changed = s.score.a !== st.score.a || s.score.b !== st.score.b;
  const stops = stopFlag || changed || s.poss !== st.poss;
  const left = s.clock - pt;
  entry.pt = pt;
  if (left > 0) {
    // after the play, if the clock is still running, at most CAP more seconds tick off before the next snap; a quarter never ends between snaps
    const ro = stops ? 0 : Math.min(CAP, left - 1);

    if (st.ot && changed) s.over = true;
  } else {
    s.clock = 0; s.ro = 0;
    if (st.ot) s.over = true;
    else if (st.q === 1 || st.q === 3) { s.q = st.q + 1; s.clock = QLEN; entry.qEnd = 'Q' + st.q; entry.text += ' End of the ' + ['', '1st', '2nd', '3rd'][st.q] + ' quarter.'; }
    else if (st.q === 2) { s.q = 3; s.clock = QLEN; s.to = { a: TO_HALF, b: TO_HALF }; entry.half = true; entry.text += ' Halftime.'; setKick(st.firstRecv, other(st.firstRecv)); }
    else if (s.score.a === s.score.b) { s.ot = true; s.q = 5; s.clock = QLEN; s.to = { a: TO_OT, b: TO_OT }; entry.otStart = true; entry.text += ' Tied after four quarters: overtime.'; setKick(other(st.firstRecv), st.firstRecv); }

}

/* ---------- server api (Vercel function + Redis) ---------- */
async function api(body, ep) {
  const h = { 'content-type': 'application/json' };
  const tk = window.HUB && window.HUB.token; if (tk) h['x-token'] = tk;
  const r = await fetch('/api/' + (ep || 'room'), { method: 'POST', headers: h, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || 'http ' + r.status); err.code = (j && j.error) || 'http'; err.status = r.status; throw err; }
  return j;
}

    const m = this.on = {
      n, wn: ret ? RVN + n : n, ret: ret ? w.ro : null, off, def, me, ctl, ctx, online, code0: S.code, D: online && both ? this.D : 0, dir: off === 'a' ? 1 : -1, st, T, keys: ret ? retKeys(T, off, def) : liveKeys(T, off, def),
      stream: { a: { ev: [], upto: ctl.a ? 0 : 9999, fin: !ctl.a }, b: { ev: [], upto: ctl.b ? 0 : 9999, fin: !ctl.b } },
      myCtl: !!ctl[me], oppCtl: !!ctl[other(me)], opp: other(me), last: 0, acc: 0, target: 0, stallAt: 0, ended: 0, inflight: false, lastNet: 0, lastStick: '0,0', pan: '', panT: 0, handed: false, tried: 0
    };

    this.build(m);
    const sc = { poss: off, ballOn: st.ballOn, down: st.down, toGo: st.toGo, teams: T };
    Field.queue = []; Field.busy = false; Field.flash = null; Field.scene = sc; Field.live = { items: [], ball: { wx: 0, sy: 0 }, los: Field.losX(sc), dir: m.dir };

  },
  // tell the room that this player runs the return (the other screen starts watching, and the server finds the stream)
  async announce(m) {
    for (let k = 0; k < 8 && this.on === m; k++) {
      try { await api({ op: 'move', code: S.code, seat: m.me, pid: PID, n: m.wn, pick: 'R', ctl: 1 }); return; }
      catch (e) { await new Promise(r => setTimeout(r, 500 * (k + 1))); }

  },
  build(m) {   // (re)create the simulation from tick zero
    m.sim = LIVE.create(m.ctx);

  },
  rebuild(m) { m.target = Math.max(m.target, m.sim.t); this.build(m); m.acc = 0; },
  snapshot(m) { return { p: m.sim.P.map(p => [p.x, p.y]), b: [m.sim.ball.x, m.sim.ball.y, m.sim.ball.z] }; },
  stop() {

  /* ----- the clock ----- */

  sync(m, s) {

  frame(ts) {

  tick(m) {

  },

  /* ----- input ----- */
  stick() {

  push(code) {

  hand() { const m = this.on; if (!m || !m.myCtl || m.handed) return; this.push(9); m.handed = true; this.panel(true); },
  key(ev, down) {

  /* ----- network ----- */

  /* ----- finishing ----- */

  finish(m) {

  },

  /* ----- drawing ----- */
  draw(m) {
    const L = Field.live; if (!L) return;
    const alpha = Math.max(0, Math.min(1, m.acc / 50)), pv = m.sn0, cu = m.sn1, sim = m.sim, dir = m.dir;
    const sc = Field.scene, los = Field.losX(sc), mid = Field.TOP + (Field.H - Field.TOP) / 2;
    const lerp = (a, b) => a + (b - a) * alpha;

    const hot = []; if (m.ctl[m.off] && sim.human.o) hot.push([m.off, sim.ctlId.o]); if (m.ctl[m.def] && sim.human.d) hot.push([m.def, sim.ctlId.d]);

      const a = pv.p[i] || cu.p[i], b = cu.p[i], x = lerp(a[0], b[0]), y = lerp(a[1], b[1]);
      const fx = p.vx * dir, face = Math.abs(fx) > 0.8 ? (fx > 0 ? 1 : -1) : (p.side === 'o' ? dir : -dir);
      const it = { wx: los + dir * x, sy: mid + y * dir * RL, wz: y * dir, key: m.keys[p.id], team: p.side === 'o' ? m.off : m.def, face, id: p.id,
        vx: p.vx * dir, vz: p.vy * dir, grp: p.grp, off: p.side === 'o', dive: p.dive > 0, down: p.hold > 0, jump: p.jump > 0, eng: !!p.eng, carrier: sim.ball.car === p.id,
        stance: (p.grp === 'OL' || p.grp === 'DL') && sim.t < 4 };

      else if (anyHot) { it.ring = TEAM_COL[other(m.me)]; }
      if (tags && tags[p.id]) it.num = tags[p.id];
      items.push(it);
    });
    items.sort((u, v) => u.sy - v.sy);
    const bx = lerp(pv.b[0], cu.b[0]), by = lerp(pv.b[1], cu.b[1]), bz = lerp(pv.b[2], cu.b[2]);
    const carried = sim.ball.car != null, car = carried ? sim.by[sim.ball.car] : null;
    L.items = items; L.los = los; L.dir = dir;
    L.ball = { wx: los + dir * bx, sy: mid + by * dir * RL, wz: by * dir, h: bz, carried, lift: carried ? 11 : bz * 9 };
    L.mine = items.some(i => i.mine); L.meOff = m.me === m.off;

      const mv = ['WASD / ARROWS', 'MOVE'];

        : qbHas ? [mv, ['J K L ;', 'THROW TO #'], ['SPACE', 'THROW AWAY']]
        : off ? (sim.kind === 'run' && sim.ball.car === 'QB' ? [mv] : [mv, ['SPACE', 'JUKE']])

  /* ----- the panel under the field ----- */
  panel(force) {

        '<div class="lvinfo" id="lvinfo"></div>' +
        (m.myCtl ? '<div class="lvpad"><div class="dpad"><button class="pb u" data-hold="u" aria-label="Up">▲</button><button class="pb l" data-hold="l" aria-label="Left">◀</button><button class="pb r" data-hold="r" aria-label="Right">▶</button><button class="pb d" data-hold="d" aria-label="Down">▼</button></div><div class="lvact" id="lvact"></div></div>' +
          '<div class="row"><button class="btn small" data-act="live-hand"' + (m.handed ? ' disabled' : '') + '>' + (m.handed ? 'The computer is playing it' : 'Let the computer play it') + '</button></div>' : '') +
        '<div class="row" id="lvforce"></div>';

    }

          acts = ['1', '2', '3', '4'].map((k, i) => '<button class="ab" data-lvk="' + k + '">' + THROWLAB[i] + '</button>').join('') + '<button class="ab wide" data-lvk="5">Throw away</button>';
        } else if (sim.kind === 'run' && sim.ball.car === 'QB') { info = 'Hold on, the handoff is coming. ' + K('WASD') + K('←↑↓→') + ' move.'; acts = ''; }
        else { info = 'You have the ball: <b>' + esc(lastName(cp ? cp.name : '')) + '</b>. ' + K('WASD') + K('←↑↓→') + ' run · ' + K('Space') + ' juke.'; acts = '<button class="ab wide" data-lvk="5">Juke</button>'; }
      } else {
        info = 'You are <b>' + esc(lastName(cp ? cp.name : '')) + '</b> (' + esc(cp && cp.pos ? cp.pos : 'defender') + '). ' + K('WASD') + K('←↑↓→') + ' move · ' + K('Space') + ' dive · ' + K('E') + ' switch player.';
        acts = '<button class="ab wide" data-lvk="5">Dive</button><button class="ab wide" data-lvk="6">Switch</button>';

  }
};


/* ---------- hub-driven games (campaign, leagues, tournaments) ---------- */
function ctxMoves() { const o = {}; for (const n in S.mine) o[n + '-' + S.me] = myMove(n); for (const n in S.lv) o[n + '-lv'] = S.lv[n]; for (const n in S.rv) o[n + '-rv'] = S.rv[n]; return o; }
function ctxFinish(G) {
  const c = S.ctx; if (!c || c.sent) return;
  c.sent = true; c.status = 'saving'; S.callSig = null;
  const done = ok => { c.status = ok ? 'ok' : 'err'; S.callSig = null; if (S.ctx === c) renderCall(S.G); };
  Promise.resolve(c.report(c.kind === 'cpu' ? ctxMoves() : null, G.state)).then(() => done(true), e => { c.err = (e && e.message) || ''; done(false); });
}
function startCtxCpu(info, ctx) {   // info: {T, seed, side, cpuSide}

  S.mode = 'local'; S.code = null; S.me = info.side; S.cpuSides = info.cpuSide ? [info.cpuSide] : []; S.seed = info.seed;
  S.seats.a = { status: 'ready', name: info.T.a.name, squad: info.T.a.squad }; S.seats.b = { status: 'ready', name: info.T.b.name, squad: info.T.b.squad };
  S.ctx = Object.assign({ kind: 'cpu', label: 'Game', sent: false, status: '' }, ctx);

}
function startCtxRoom(info, ctx) {  // info: {room, seed, side}

  S.mode = 'online'; S.code = info.room; S.seed = info.seed; S.me = info.side; S.lvLoaded = false;
  S.ctx = Object.assign({ kind: 'room', label: 'Live game', sent: false, status: '' }, ctx);

}
function startBoard(o) {   // hub-driven snake draft (tournaments): {label, d, me, names, post, poll, onDone}

  S.mode = 'sdraft'; S.me = null;
  sdStart(o); sdPollLoop(); render(); sdStep();

    } else if (L.phase === 'playoffs') h += '<div class="panel next"><h2>' + (L.po && L.po.out && L.po.out[tid] ? 'Your season is over' : 'Waiting on the other games') + '</h2></div>';
    else h += '<div class="panel next"><h2>No game this week</h2><p class="sub">' + (A.waitMsg || 'The week moves on once every game is done.') + '</p></div>';
  } else if (L.phase === 'offseason') {
    const last = L.hist[L.hist.length - 1];
    h += '<div class="panel next"><span class="eyebrow">Season ' + L.season + ' complete</span><h2>' + (last && last.champ != null ? esc(L.teams[last.champ].name) + ' are champions' : 'Regular season over') + '</h2>' +
      (last && last.awards && last.awards.players.length ? '<p class="sub">' + last.awards.players.slice(0, 3).map(a => a.label + ': <b>' + esc(a.n) + '</b>').join(' · ') + ' — all awards are on the Stats tab.</p>' : '') + (A.canAdvance ? '<p class="sub">Next: players age and develop, then the rookie draft.</p><div class="row"><button class="btn primary" data-h="fr-offseason">Start the offseason</button></div>' : '<p class="sub">Waiting for the manager to start the offseason.</p>') + '</div>';
  } else if (L.phase === 'draft') {
    const on = LG.onClock(L), d = L.draft;
    h += '<div class="panel next"><span class="eyebrow">' + (d.kind === 'league' ? 'League draft' : 'Rookie draft') + '</span><h2>' + (on === tid ? 'You are on the clock' : on != null ? esc(L.teams[on].name) + ' are picking' : 'Draft complete') + '</h2>' +
      '<p class="sub">Pick ' + Math.min(d.pos + 1, d.seq.length) + ' of ' + d.seq.length + '.</p><div class="row"><button class="btn primary" data-h="fr-tab" data-t="draft">Open the draft board</button></div></div>';
  } else if (L.phase === 'preseason') {
    const n = LG.rosterOf(L, tid).length, over = n > LG.ROSTER_MAX;
    h += '<div class="panel next"><span class="eyebrow">Preseason</span><h2>Roster: ' + n + ' / ' + LG.ROSTER_MAX + '</h2>' +
      (over ? '<p class="sub bad">Cut ' + (n - LG.ROSTER_MAX) + ' player' + (n - LG.ROSTER_MAX > 1 ? 's' : '') + ' before the season.</p><div class="row"><button class="btn" data-h="fr-trim">Cut the lowest-rated extras</button></div>' : '') +
      (A.canAdvance ? '<div class="row"><button class="btn primary"' + (over && A.kind === 'campaign' ? ' disabled' : '') + ' data-h="fr-season">Start season ' + (L.season + 1) + '</button></div>' : '<p class="sub">Waiting for the manager to start the season.</p>') + '</div>';
  }
  if (L.progress && (L.phase === 'draft' || L.phase === 'preseason')) {
    const mine = LG.rosterOf(L, tid).filter(p => (L.progress.up.indexOf(p.i) >= 0 || L.progress.down.indexOf(p.i) >= 0));
    const ret = L.progress.retired.map(id => PL(L, id)).filter(p => p && p.lt === tid);
    if (mine.length) h += '<div class="panel"><h3>Player development</h3><ul class="news">' + mine.map(p => '<li>' + esc(p.n) + ' (' + p.p + ') ' + (p.h && p.h.length ? (p.h[p.h.length - 1] + ' → <b>' + p.o + '</b>') : p.o) + ' ' + trend(p) + '</li>').join('') + '</ul></div>';
  }
  h += '<div class="panel"><h3>League news</h3>' + (L.news.length ? '<ul class="news">' + L.news.slice(0, 8).map(n => '<li><span>' + n.s + '</span> ' + esc(n.t) + '</li>').join('') + '</ul>' : '<p class="hint">Nothing yet.</p>') + '</div>';
  return h;
};
ACT['fr-play'] = async t => { await FR.A.play(t.dataset.g); };
ACT['fr-sim'] = async t => { await FR.A.sim(t.dataset.g); };
ACT['fr-offseason'] = async () => { await FR.A.go('offseason'); };
ACT['fr-season'] = async () => { await FR.A.go('season'); };
ACT['fr-trim'] = async () => { await FR.A.go('trim'); };

FRV.sched = A => {
  const L = A.L, tid = A.tid;
  const games = L.sched.filter(g => g.h === tid || g.a === tid).sort((a, b) => a.w - b.w);
  const rows = games.map(g => {
    const home = g.h === tid, mine = home ? g.sh : g.sa, theirs = home ? g.sa : g.sh;
    const res = g.done ? '<b class="' + (mine > theirs ? 'win' : mine < theirs ? 'loss' : '') + '">' + (mine > theirs ? 'W' : mine < theirs ? 'L' : 'T') + ' ' + mine + '-' + theirs + (g.ot ? ' OT' : '') + (g.ff != null ? ' (forfeit)' : '') + '</b>' : (g.w === L.week && (L.phase === 'regular' || L.phase === 'playoffs') ? 'This week' : '');
    return '<tr><td>' + (g.pl === 'po' ? 'PO' : g.w) + '</td><td class="nm">' + esc(gameLine(L, g, tid)) + '</td><td>' + res + '</td></tr>';
  }).join('');
  return '<div class="panel">' + tbl(['Wk', 'Opponent', 'Result'], rows) + '</div>';
};

FRV.roster = A => {
  const L = A.L, tid = FR.rtid != null && L.teams[FR.rtid] ? FR.rtid : A.tid, ro = LG.rosterOf(L, tid), ln = LG.lineup(L, tid);
  const start = {}; POSN.forEach(p => ln[p].forEach(x => { start[x.i] = 1; }));
  const mineT = tid === A.tid;
  let h = '<div class="panel"><div class="row between"><h3>' + esc(L.teams[tid].name) + ' · ' + ro.length + ' / ' + LG.ROSTER_MAX + '</h3><select data-hc="rtid" aria-label="Team">' + L.teams.map(x => '<option value="' + x.id + '"' + (x.id === tid ? ' selected' : '') + '>' + esc(x.name) + (x.owner ? ' (' + esc(x.owner === 'You' ? 'you' : x.owner) + ')' : '') + '</option>').join('') + '</select></div>';
  POSN.forEach(pos => {
    const list = ro.filter(p => p.p === pos).sort((a, b) => b.o - a.o);
    h += '<h4 class="pos-h">' + (LG.POS_NAME && LG.POS_NAME[pos] || pos) + ' <small>' + (pos === 'KR' ? 'returns kickoffs' : pos === 'PR' ? 'returns punts' : 'starts ' + LG.counts(L.teams[tid].sch)[pos]) + '</small></h4>' +
      tbl(['Pos', 'Name', 'Age', 'OVR', '', ''], plRows(L, list, p => (start[p.i] ? '<span class="star" title="Starter">★</span> ' : '') + (mineT && A.canEditRoster() ? '<button class="btn small ghost" data-h="fr-rel" data-id="' + p.i + '">Release</button>' : '')));
  });

};
ACT['fr-rel'] = async t => { const p = PL(FR.A.L, t.dataset.id); if (!p || !confirm('Release ' + p.n + '?')) return; await FR.A.act('release', { pid: t.dataset.id }); };

FRV.stand = A => {
  const L = A.L, S = LG.standings(L);
  let h = '';
  S.divs.forEach(d => {
    h += '<div class="panel"><h3>' + esc(d.name) + '</h3>' + tbl(['Team', 'W-L-T', 'PF', 'PA', 'Diff'], d.rows.map(r => { const t = L.teams[r.id]; return '<tr class="' + (r.id === A.tid ? 'me' : '') + '"><td class="nm">' + tmName(t) + (t.owner ? ' <small class="hum">' + esc(t.owner === 'You' ? '' : t.owner) + '</small>' : '') + (L.po && L.po.seeds && L.po.seeds[r.id] ? ' <small class="seed">#' + L.po.seeds[r.id] + '</small>' : '') + '</td><td>' + rec(r) + '</td><td>' + r.pf + '</td><td>' + r.pa + '</td><td>' + (r.pd > 0 ? '+' : '') + r.pd + '</td></tr>'; }).join('')) + '</div>';

};

/* trades */
const plPick = (L, ids, side) => ids.map(p => '<label class="pk"><input type="checkbox" data-h="tr-tog" data-side="' + side + '" data-id="' + p.i + '"' + (FR[side].indexOf(p.i) >= 0 ? ' checked' : '') + '><span class="pos">' + p.p + '</span> ' + esc(p.n) + ' <b>' + p.o + '</b> <small>' + p.a + 'y</small></label>').join('');
// draft picks in the trade lists: round, year, who it came from, and where it is expected to land
const pkPick = (L, tid, side) => {
  const fr = LG.strengthFrac(L), ks = LG.picksOf(L, tid).filter(k => LG.pickOpen(L, k));
  if (!ks.length) return '<p class="hint">No picks to trade.</p>';
  const years = Array.from(new Set(ks.map(k => k.y)));
  return '<div class="pkgrid">' + years.map(y => '<div class="pkrow"><span class="pky">' + y + '</span>' + ks.filter(k => k.y === y).map(k => {
    const id = LG.pickId(k), pj = LG.pickProjection(L, k, fr);
    const tip = 'Round ' + k.r + ', ' + k.y + (k.o === k.t ? '' : ' (from ' + L.teams[k.o].name + ')') + ' · expected overall pick ' + (pj.known ? '' : '≈') + pj.overall + ' · value ' + Math.round(LG.pickValue(L, k, fr));
    return '<label class="pkc' + (k.o === k.t ? '' : ' via') + '" title="' + esc(tip) + '"><input type="checkbox" data-h="tr-tog" data-side="' + side + '" data-id="' + id + '"' + (FR[side].indexOf(id) >= 0 ? ' checked' : '') + '><span>R' + k.r + '</span><b>' + Math.round(LG.pickValue(L, k, fr)) + '</b>' + (k.o === k.t ? '' : '<small>' + esc(L.teams[k.o].abbr) + '</small>') + '</label>';
  }).join('') + '</div>').join('') + '</div>';
};
FRV.trades = A => {
  const L = A.L, tid = A.tid;
  LG.ensurePicks(L);
  if (!LG.canTrade(L)) return '<div class="panel"><h3>Trades are closed</h3><p class="sub">' + (L.cfg && L.cfg.trades === false ? 'The manager turned trading off for this league.' : 'The deadline has passed. Trading opens again in the offseason.') + '</p></div>';
  const others = L.teams.filter(t => t.id !== tid);
  if (FR.to == null || FR.to === tid || !L.teams[FR.to]) FR.to = others[0].id;
  const to = L.teams[FR.to];
  const mine = LG.rosterOf(L, tid).sort((a, b) => POSN.indexOf(a.p) - POSN.indexOf(b.p) || b.o - a.o), theirs = LG.rosterOf(L, FR.to).sort((a, b) => POSN.indexOf(a.p) - POSN.indexOf(b.p) || b.o - a.o);
  const frs = LG.strengthFrac(L);
  const valSum = ids => Math.round(ids.reduce((s, id) => s + LG.assetValue(L, id, frs), 0));
  let h = '';
  if (A.kind === 'league') {
    const inc = (L.offers || []).filter(o => o.to === tid), out = (L.offers || []).filter(o => o.from === tid);
    if (inc.length || out.length) {
      h += '<div class="panel"><h3>Offers between managers</h3><ul class="offers">' +
        inc.map(o => '<li><b>' + esc(L.teams[o.from].name) + '</b> offer ' + o.give.map(i => esc(plLabel(L, i))).join(', ') + ' for your ' + o.get.map(i => esc(plLabel(L, i))).join(', ') + '<span class="row"><button class="btn small primary" data-h="to-acc" data-id="' + o.id + '">Accept</button><button class="btn small" data-h="to-dec" data-id="' + o.id + '">Decline</button></span></li>').join('') +
        out.map(o => '<li>You offered ' + o.give.map(i => esc(plLabel(L, i))).join(', ') + ' to <b>' + esc(L.teams[o.to].name) + '</b> for ' + o.get.map(i => esc(plLabel(L, i))).join(', ') + '<span class="row"><button class="btn small ghost" data-h="to-can" data-id="' + o.id + '">Cancel</button></span></li>').join('') + '</ul></div>';
    }
  }
  h += '<div class="panel"><div class="row between"><h3>Propose a trade</h3><select data-hc="trto" aria-label="Trade partner">' + others.map(t => '<option value="' + t.id + '"' + (t.id === FR.to ? ' selected' : '') + '>' + esc(t.name) + (t.owner ? ' (' + esc(t.owner) + ')' : '') + '</option>').join('') + '</select></div>' +
    '<div class="trcols"><div><h4>You send · value ' + valSum(FR.give) + '</h4>' + pkPick(L, tid, 'give') + '<div class="pklist">' + plPick(L, mine, 'give') + '</div></div><div><h4>' + esc(to.nick) + ' send · value ' + valSum(FR.get) + '</h4>' + pkPick(L, FR.to, 'get') + '<div class="pklist">' + plPick(L, theirs, 'get') + '</div></div></div>' +
    '<div class="row"><button class="btn primary" data-h="tr-prop">' + (to.owner ? 'Send offer to ' + esc(to.owner) : 'Propose to ' + esc(to.nick)) + '</button><button class="btn ghost" data-h="tr-clear">Clear</button></div>' +
    '<p class="hint">CPU teams judge by player value, age and what they need. Draft picks are worth more the earlier the round, the sooner the draft, and the worse the original team is projected to finish (hover a pick to see its expected overall slot; far-off picks are less certain and discounted). Dashed picks came from another team. Rosters must keep a full set of starters and stay at ' + LG.ROSTER_MAX + ' or fewer.</p></div>';
  h += '<div class="panel"><div class="row between"><h3>CPU offers</h3><button class="btn small" data-h="tr-offers">Find offers</button></div>' +
    (FR.offers ? (FR.offers.length ? '<ul class="offers">' + FR.offers.map((o, i) => '<li>' + esc(L.teams[o.t].name) + ' would give ' + o.get.map(id => esc(plLabel(L, id))).join(', ') + ' for your ' + o.give.map(id => esc(plLabel(L, id))).join(', ') + '<span class="row"><button class="btn small primary" data-h="tr-acc" data-i="' + i + '">Accept</button></span></li>').join('') + '</ul>' : '<p class="hint">No teams are interested right now.</p>') : '<p class="hint">Ask around to see which CPU teams would make a deal.</p>') + '</div>';
  return h;
};
ACT['tr-tog'] = t => { const a = FR[t.dataset.side], i = a.indexOf(t.dataset.id); if (t.checked && i < 0) a.push(t.dataset.id); else if (!t.checked && i >= 0) a.splice(i, 1); frShow(FR.A); };

ACT['tr-prop'] = async () => {
  if (!FR.give.length && !FR.get.length) { toast('Pick at least one player or draft pick.'); return; }
  const r = await FR.A.act('trade', { to: FR.to, give: FR.give.slice(), get: FR.get.slice() });

  if (r) toast(r.msg || (r.ok ? 'Done.' : 'No deal.'));
  frShow(FR.A);
};
ACT['tr-offers'] = async () => { FR.offers = await FR.A.cpuOffers(); frShow(FR.A); };
ACT['tr-acc'] = async t => { const o = FR.offers[+t.dataset.i]; const r = await FR.A.act('trade', { to: o.t, give: o.give, get: o.get }); if (r) toast(r.msg); FR.offers = null; frShow(FR.A); };
ACT['to-acc'] = async t => { const r = await FR.A.act('tradeop', { id: t.dataset.id, act: 'accept' }); if (r) toast(r.msg || 'Done.'); };
ACT['to-dec'] = async t => { await FR.A.act('tradeop', { id: t.dataset.id, act: 'decline' }); };
ACT['to-can'] = async t => { await FR.A.act('tradeop', { id: t.dataset.id, act: 'cancel' }); };

FRV.stats = A => {
  const L = A.L;
  const cats = [['pyd', 'Passing yards'], ['ptd', 'Passing TDs'], ['ryd', 'Rushing yards'], ['recyd', 'Receiving yards'], ['sk', 'Sacks'], ['dint', 'Interceptions']];
  let h = '<div class="grid2">';
  cats.forEach(c => {
    const top = LG.leaders(L, c[0], 6);
    h += '<div class="panel"><h3>' + c[1] + '</h3>' + (top.length ? '<ol class="leaders">' + top.map(x => { const t = L.teams[x.t]; return '<li class="' + (x.t === A.tid ? 'me' : '') + '"><span>' + esc(x.n) + ' <small>' + (t ? esc(t.abbr) : 'FA') + '</small></span><b>' + x.v + '</b></li>'; }).join('') + '</ol>' : '<p class="hint">No games played yet.</p>') + '</div>';

      x.awards.teams.map(a => '<li class="' + (a.t === A.tid ? 'me' : '') + '"><span>' + a.label + '</span> <b>' + esc(L.teams[a.t].name) + '</b></li>').join('') + '</ul>').join('') + '</div>';
  }
  if (L.hist.length) h += '<div class="panel"><h3>Champions</h3><ul class="news">' + L.hist.slice().reverse().map(x => '<li><span>' + x.season + '</span> ' + (x.champ != null ? esc(L.teams[x.champ].name) : '—') + '</li>').join('') + '</ul></div>';
  return h;
};

/* draft board */
FRV.draft = A => {
  const L = A.L, d = L.draft, tid = A.tid, on = LG.onClock(L);
  if (!d) return '<div class="panel"><p class="hint">No draft is running.</p></div>';
  const q = FR.dq.toLowerCase(), mineTurn = on === tid && tid >= 0;
  let pool = d.pool.map(id => PL(L, id)).filter(p => p && (FR.dpos === 'ALL' || p.p === FR.dpos) && (!q || p.n.toLowerCase().indexOf(q) >= 0));
  pool.sort((a, b) => (b.o + (d.kind === 'rookie' ? b.pt * 0.5 : 0)) - (a.o + (d.kind === 'rookie' ? a.pt * 0.5 : 0)));
  pool = pool.slice(0, 50);
  const auto = d.auto && (d.auto[tid] === true || d.auto.all === true);
  const myPicks = d.picks.filter(x => x.t === tid).map(x => PL(L, x.p)).filter(Boolean);
  const left = d.seq.slice(d.pos).filter(t => t === tid).length;
  let h = '<div class="panel next"><span class="eyebrow">Pick ' + Math.min(d.pos + 1, d.seq.length) + ' of ' + d.seq.length + '</span><h2>' + (mineTurn ? 'You are on the clock' : on != null ? esc(L.teams[on].name) + ' are on the clock' : 'Draft complete') + '</h2>' +
    '<p class="sub">You have ' + left + ' pick' + (left === 1 ? '' : 's') + ' left. ' + (d.kind === 'league' ? 'You must still be able to fill every starting spot.' : '') + '</p>' +
    (d.cap && tid >= 0 ? (ci => '<p class="sub">Salary cap $' + d.cap + 'M · spent <b>$' + Math.round(ci.spent * 10) / 10 + 'M</b> · room <b>$' + Math.round(ci.room * 10) / 10 + 'M</b>. Salaries follow rating and position: QBs and pass rushers cost the most, running backs and safeties the least.</p>')(LG.capInfo(L, tid)) : '') +
    '<div class="row">' + (tid >= 0 ? '<button class="btn' + (auto ? ' primary' : '') + '" data-h="fr-dauto">' + (auto ? 'Auto-draft is ON' : 'Auto-draft for me') + '</button>' : '') + (A.draftBtns ? A.draftBtns() : '') + '</div></div>';
  h += '<div class="panel"><div class="row between"><h3>Available players</h3><span class="row"><input type="text" id="dq" placeholder="Search name" value="' + esc(FR.dq) + '" aria-label="Search"><select data-hc="dpos" aria-label="Position"><option>ALL</option>' + POSN.map(p => '<option' + (p === FR.dpos ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></span></div>' +
    tbl(['Pos', 'Name', 'Age', 'OVR', '', ''], plRows(L, pool, p => mineTurn ? '<button class="btn small primary" data-h="fr-draft" data-id="' + p.i + '"' + (d.kind === 'league' && (!LG.canDraftPos(L, tid, p.p) || !LG.affordable(L, tid, p)) ? ' disabled' : '') + '>Draft' + (d.cap ? ' · $' + Math.round(LG.salOf(p) * 10) / 10 + 'M' : '') + '</button>' : '')) + '</div>';
  if (myPicks.length) h += '<div class="panel"><h3>Your picks</h3><ul class="news">' + myPicks.map(p => '<li>' + p.p + ' ' + esc(p.n) + ' <b>' + p.o + '</b></li>').join('') + '</ul></div>';
  const recent = d.picks.slice(-8).reverse();
  if (recent.length) h += '<div class="panel"><h3>Recent picks</h3><ul class="news">' + recent.map(x => '<li><span>#' + x.n + '</span> ' + esc(L.teams[x.t].nick) + ': ' + esc(plLabel(L, x.p)) + '</li>').join('') + '</ul></div>';
  return h;
};
ACT['fr-draft'] = async t => { await FR.A.act('draft', { pid: t.dataset.id }); };

const SAVE = {
  n: () => H.user ? 5 : 3,
  meta: L => { const t = L.teams[L.user]; return { team: t ? t.name : '', season: L.season, week: L.week, phase: L.phase, updated: Date.now() }; },
  async list() {
    if (H.user) return (await call('save', { op: 'list' })).slots;
    const out = [];
    for (let i = 1; i <= 3; i++) { let m = null; try { m = JSON.parse(lsGet('gd_cm' + i)); } catch (e) {} out.push(m ? Object.assign({ slot: i }, m) : { slot: i, empty: true }); }
    return out;
  },
  async get(slot) {
    if (H.user) return (await call('save', { op: 'get', slot })).L;
    return JSON.parse(lsGet('gd_c' + slot));
  },
  async put(slot, L) {
    if (H.user) { await call('save', { op: 'put', slot, L }); return; }
    if (!lsSet('gd_c' + slot, JSON.stringify(L)) || !lsSet('gd_cm' + slot, JSON.stringify(SAVE.meta(L)))) throw new Error('This device ran out of storage. Sign in to save online.');
  },
  async del(slot) { if (H.user) await call('save', { op: 'delete', slot }); else { lsSet('gd_c' + slot, null); lsSet('gd_cm' + slot, null); } }
};
const C = { L: null, slot: 0, timer: 0, state: 'saved', base: null };

async function campSave() {
  clearTimeout(C.timer); C.timer = 0;
  if (!C.L) return;
  C.state = 'saving';
  try { await SAVE.put(C.slot, C.L); C.state = 'saved'; } catch (e) { C.state = 'error'; toast(e.message && /\s/.test(e.message) ? e.message : 'Could not save. Check your connection.'); }
  const el = $('.chip.savechip'); if (el) el.textContent = savedText();
}
const savedText = () => C.state === 'saved' ? 'Saved' : C.state === 'saving' ? 'Saving…' : C.state === 'error' ? 'Not saved!' : 'Unsaved changes';
function campDirty(now) {
  C.state = 'dirty'; clearTimeout(C.timer);
  if (now) campSave(); else C.timer = setTimeout(campSave, 2500);
}

V.camp = async () => {
  setMain('<section class="panel"><h2>Campaign</h2><p class="sub">Loading saves…</p></section>');
  const slots = await run(() => SAVE.list()); if (!slots) { setMain('<section class="panel"><h2>Campaign</h2><p class="sub bad">Could not load your saves.</p></section>'); return; }
  setMain('<section class="panel"><h2>Campaign</h2><p class="sub">Take over a real NFL team for the 2026 season. You make the roster moves and play your own games; the CPU runs the other 31 teams. ' +
    (H.user ? 'Saves are stored on your account.' : 'You are a guest: saves stay on this device. Sign in to keep them on your account.') + '</p><div class="slots">' +
    slots.map(s => s.empty ? '<div class="slot-card"><b>Slot ' + s.slot + '</b><span class="sub">Empty</span><button class="btn primary" data-h="camp-new" data-slot="' + s.slot + '">New campaign</button></div>' :
      '<div class="slot-card"><b>Slot ' + s.slot + ' · ' + esc(s.team) + '</b><span class="sub">' + s.season + ' · ' + ({ regular: 'Week ' + s.week, playoffs: 'Playoffs', offseason: 'Offseason', draft: 'Draft', preseason: 'Preseason' }[s.phase] || s.phase) + '</span>' +
      '<div class="row"><button class="btn primary" data-h="camp-load" data-slot="' + s.slot + '">Continue</button><button class="btn ghost" data-h="camp-del" data-slot="' + s.slot + '">Delete</button></div></div>').join('') + '</div></section>');
};

function campAdapter() {
  const L = C.L, tid = L.user;
  const after = (now) => { campDirty(now); frShow(campAdapter()); };
  return {
    kind: 'campaign', L, tid, title: 'Campaign', canAdvance: true, canEditRoster: () => true, status: savedText(),
    headBtns: '<button class="btn small" data-h="camp-exit">Save &amp; exit</button>',
    cpuOffers: async () => LG.cpuOffers(L, tid),
    async act(op, a) {
      let r = { ok: true };
      if (op === 'trade') {
        if (!LG.canTrade(L)) r = { ok: false, msg: 'Trading is closed right now.' };
        else { const x = LG.cpuTrade(L, tid, a.to, a.give, a.get); if (x.ok) LG.doTrade(L, tid, a.to, a.give, a.get); r = { ok: x.ok, msg: x.msg }; }
      } else if (op === 'sign') { const e = LG.signFA(L, tid, a.pid); r = { ok: !e, msg: e || 'Signed.' }; }
      else if (op === 'release') { const e = LG.release(L, tid, a.pid); r = { ok: !e, msg: e || 'Released.' }; }
      else if (op === 'draft') {
        if (!LG.draftPick(L, tid, a.pid)) r = { ok: false, msg: 'That pick is not allowed.' };
        else { LG.autoDraftToHuman(L); }
      } else if (op === 'draftauto') { L.draft.auto = L.draft.auto || {}; L.draft.auto[tid] = !!a.on; LG.autoDraftToHuman(L); }
      if (!r.ok && r.msg) toast(r.msg);
      after(op === 'draft' && L.phase !== 'draft'); return r;
    },
    async go(op) {
      if (op === 'offseason') { LG.offseasonBegin(L, 7); FR.tab = L.phase === 'draft' ? 'draft' : 'home'; }
      else if (op === 'season') { LG.startSeason(L); LG.runUntilHuman(L, 60); FR.tab = 'home'; }
      else if (op === 'trim') LG.trimRoster(L, tid);
      after(true);
    },
    async sim(gid) { const g = L.sched.find(x => x.id === gid); if (!g || g.done) return; LG.simGame(L, g); LG.runUntilHuman(L, 60); LG.checkFinal(L); after(true); },
    async play(gid) {
      const g = L.sched.find(x => x.id === gid); if (!g || g.done) return;
      g.T = LG.teamsFor(L, g.h, g.a);
      const side = g.h === tid ? 'a' : 'b', cpuSide = side === 'a' ? 'b' : 'a';
      G.startCtxCpu({ seed: LG.gameSeed(L, g), T: g.T, side, cpuSide }, {
        label: g.pl === 'po' ? 'Playoffs' : 'Week ' + g.w,
        report: async moves => { if (!LG.playVerified(L, g, moves, [cpuSide])) throw new Error('The game did not finish.'); },
        onDone: () => { LG.runUntilHuman(L, 60); LG.checkFinal(L); campDirty(true); go('camphub'); }
      });
    }
  };
}
V.camphub = () => { if (!C.L) { go('camp'); return; } frShow(campAdapter()); };

/* loading and rendering */
async function lgLoad(code, force) {
  const r = await call('league', { op: 'get', code, ver: force || LGS.code !== code ? 0 : LGS.ver });
  if (r.same) return false;
  Object.assign(LGS, { code, ver: r.ver, mgr: r.mgr, members: r.members, L: r.L, member: r.member });
  return true;
}
V.league = async p => {
  if (!p.code) return go('leagues');
  if (LGS.code !== p.code) { LGS.L = null; setMain('<section class="panel"><p class="sub">Loading league…</p></section>'); }
  const ok = await run(() => lgLoad(p.code, true)); if (ok === null) { go('leagues'); return; }
  lgRender();
  poll(async () => { if (await lgLoad(p.code)) lgRender(); }, 5000);
};
async function lgReload() { await lgLoad(LGS.code, true); lgRender(); }
function lgRender() {
  if (H.view !== 'league' || G.state.mode !== 'lobby') return;
  const L = LGS.L;
  if (!LGS.member) { setMain('<section class="panel narrow"><h2>' + esc(L.cfg.name) + '</h2><p class="sub">You have not joined this league.</p><div class="row"><button class="btn primary" data-h="lg-join">Join league</button></div></section>'); return; }
  if (L.phase === 'setup') lgLobby(); else frShow(lgAdapter());
}
ACT['lg-join'] = async () => { if (await run(() => call('league', { op: 'join', code: LGS.code }))) lgReload(); };
async function lgOp(op, extra) {
  const r = await run(() => call('league', Object.assign({ op, code: LGS.code }, extra || {})));
  if (r && r.deleted) { go('leagues'); return r; }
  if (r && r.left) { go('leagues'); return r; }
  if (r) await lgReload();
  return r;
}
async function lgCfg(c) { await lgOp('cfg', { cfg: c }); }

  let h = '<section class="panel"><h3>The draft is live</h3><p class="sub">' + (DR.isDone(d) ? 'Finishing up…' : 'Pick ' + (d.picks.length + 1) + ' of ' + d.order.length + ' · on the clock: <b>' + nm(clock) + '</b>' + (entName(T, dr.order[clock]).owner === me ? ' (you)' : '')) + '</p>' +
    '<ol class="ordlist">' + dr.order.map((id, t) => { const e = entName(T, id), n = DR.teamIds(d, t).length; return '<li><span class="seedn">' + (t + 1) + '</span><span class="nm">' + entLabel(T, id, me) + '</span><span class="sub">' + n + ' / 7 picks' + (d.cap ? ' · $' + Math.round(DR.spent(DR.teamIds(d, t))) + 'M' : '') + (e.auto ? ' · auto' : '') + '</span></li>'; }).join('') + '</ol>' +
    '<div class="row">' + (mine ? '<button class="btn primary" data-h="tn-board">Open the draft board</button>' : '') + (mgr ? '<button class="btn small" data-h="tn-dskip">Auto-pick for whoever is on the clock</button><button class="btn small" data-h="tn-dall">Auto-draft everything left</button><button class="btn small ghost" data-h="tn-dcancel">Cancel draft</button>' : '') + '</div></section>';
  return h;
}

/* bracket */
function tnBracket(T, me, mgr, mine) {
  const br = T.br, rounds = [];
  for (let r = 1; r <= br.rounds; r++) rounds.push(br.matches.filter(m => m.r === r));
  const rname = r => LG.ROUND_NAMES(br.rounds - r + 1);
  let h = '<section class="panel"><h3>Bracket</h3><div class="bracket">';
  rounds.forEach((ms, ri) => {
    h += '<div class="bround"><h4>' + rname(ri + 1) + '</h4>';
    ms.forEach(m => {
      const A = m.a != null ? T.seeds[m.a] : null, B = m.b != null ? T.seeds[m.b] : null;
      const live = m.a != null && m.b != null && m.win == null;
      const row = (id, idx, wins) => '<div class="bt' + (m.win != null && m.win === (idx ? m.b : m.a) ? ' won' : '') + (entName(T, id) && entName(T, id).owner === me ? ' mine' : '') + '"><span class="bs">' + (idx ? (m.b != null ? m.b + 1 : '') : (m.a != null ? m.a + 1 : '')) + '</span><span class="bn">' + (id ? entLabel(T, id, me) : (m.bye ? '<span class="sub">bye</span>' : '<span class="sub">TBD</span>')) + '</span><b class="bw">' + (m.bye ? '' : wins) + '</b></div>';
      h += '<div class="bm' + (live ? ' live' : '') + '">' + row(A, 0, m.w[0]) + row(B, 1, m.w[1]) + (m.bye ? '' : '<div class="bmeta">' + (m.bo > 1 ? 'Best of ' + m.bo : 'One game') + (m.games.length ? ' · ' + m.games.map(g => g[0] + '-' + g[1]).join(', ') : '') + '</div>');
      if (live) {
        const EA = entName(T, A), EB = entName(T, B), inIt = mine && (EA === mine || EB === mine), oppCpu = inIt && ((EA === mine ? EB : EA).kind === 'cpu'), act = [];
        if (inIt) { act.push('<button class="btn small primary" data-h="tn-play" data-mid="' + m.id + '">Play game ' + (m.games.length + 1) + '</button>'); if (oppCpu) act.push('<button class="btn small" data-h="tn-simme" data-mid="' + m.id + '">Sim it</button>'); }
        if (mgr) { act.push('<button class="btn small ghost" data-h="tn-simm" data-mid="' + m.id + '">Sim game</button><button class="btn small ghost" data-h="tn-win" data-mid="' + m.id + '" data-side="0">Top wins</button><button class="btn small ghost" data-h="tn-win" data-mid="' + m.id + '" data-side="1">Bottom wins</button>'); }
        h += '<div class="bact">' + act.join('') + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  return h + '</div></section>';
}
ACT['tn-simme'] = t => tnOp('simme', { mid: t.dataset.mid });
ACT['tn-simm'] = t => tnOp('simmatch', { mid: t.dataset.mid });
ACT['tn-win'] = t => { if (confirm('Set this series winner by hand?')) tnOp('override', { mid: t.dataset.mid, side: +t.dataset.side }); };
ACT['tn-play'] = async t => {
  const mid = t.dataset.mid, code = TNS.code;
  const info = await run(() => call('tourney', { op: 'play', code, mid })); if (!info) return;
  const report = async moves => {
    try { await call('tourney', { op: 'report', code, mid, moves: moves || undefined }); }
    catch (e) { const r = await call('tourney', { op: 'get', code }); const m = r.T.br.matches.find(x => x.id === mid); if (!(m && (m.games.length > info.k || m.win != null))) throw e; }
  };
  const ctx = { label: info.homeName + ' – ' + info.awayName, report, onDone: () => { TNS.ver = 0; go('tourney', { code }); } };
  if (info.room) G.startCtxRoom({ room: info.room, seed: info.seed, side: info.side }, ctx);
  else G.startCtxCpu(info, ctx);
};

/* ---------- boot hooks ---------- */
window.HUB = {
  get token() { return H.token; }, get user() { return H.user; },
  boot, show, renderHeader,
  ready() { G.resume(); }
};

})();
</script>
