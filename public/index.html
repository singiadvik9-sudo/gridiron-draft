<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron Draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout concept: a night-game broadcast. Dark stadium ground, chalk-white type,
   coral vs blue team colors, a yellow first-down-line accent used for the one primary action. */
:root {
  color-scheme: dark;
  --ink: #0b1020;
  --panel: #121a30;
  --panel2: #1a2442;
  --line: #2b3860;
  --chalk: #efe9d6;
  --mute: #93a0c4;
  --flag: #ffcf3f;
  --ta: #ff6b4a;
  --tb: #4aa8ff;
  --good: #5fd38d;
  --bad: #ff6b6b;
  --display: 'Silkscreen', 'Courier New', monospace;
  --body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--chalk);
  font-family: var(--body); font-size: 18px; line-height: 1.3;
  padding-inline: 16px; padding-block: 14px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
canvas.spr { image-rendering: pixelated; display: block; }

/* header */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 3px solid var(--line); position: relative; }
.mast::after { content: ''; position: absolute; left: 0; bottom: -3px; width: 96px; height: 3px; background: var(--flag); }
.brand { font-family: var(--display); font-size: clamp(22px, 5vw, 34px); letter-spacing: .04em; font-weight: 700; text-transform: uppercase; }
.brand span { color: var(--flag); }
#hdr-right { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-block; font-family: var(--display); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 8px; border: 2px solid var(--line); border-radius: 2px; color: var(--chalk); background: var(--panel); }
.chip[style*="--tc"] { border-color: var(--tc); color: var(--tc); }
.chip.ok { border-color: var(--good); color: var(--good); }
.chip.room { border-color: var(--flag); color: var(--flag); }
.trait { font-size: 12px; color: var(--mute); line-height: 1.15; margin-top: 3px; }

/* buttons */
.btn { font-family: var(--display); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 16px; background: var(--panel2); color: var(--chalk); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 2px; }
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--flag); color: #1a1405; border-color: #a67d00; }
.btn.primary:hover:not(:disabled) { border-color: #ffe27a; }
.btn.small { font-size: 11px; padding: 8px 10px; border-bottom-width: 4px; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* shared */
.panel { background: var(--panel); border: 2px solid var(--line); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-family: var(--display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; }
.sub { color: var(--mute); font-size: 19px; max-width: 62ch; }
.hint { color: var(--mute); font-size: 16px; }
.eyebrow { font-family: var(--display); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.fld { font-family: var(--display); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); display: block; }
input[type=text] { font: inherit; font-size: 20px; width: 100%; padding: 10px 12px; background: var(--ink); color: var(--chalk); border: 2px solid var(--line); border-radius: 2px; min-width: 0; }
input[type=text]::placeholder { color: #5b6890; }
.grade { font-family: var(--display); font-size: 13px; display: inline-grid; place-items: center; width: 24px; height: 24px; border: 2px solid var(--line); background: var(--ink); }
.grade.g-S, .g-S .grade { border-color: var(--flag); color: var(--flag); }
.grade.g-A, .g-A .grade { border-color: var(--good); color: var(--good); }
.grade.g-B, .g-B .grade { border-color: var(--tb); color: var(--tb); }
.grade.g-C, .g-C .grade { color: var(--mute); }
.grade.g-D, .g-D .grade { border-color: var(--bad); color: var(--bad); }

/* lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.hero { grid-column: 1 / -1; display: grid; gap: 14px; padding-block: 8px 4px; }
.lineup { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; padding: 14px; background: repeating-linear-gradient(90deg, #1f5233 0 48px, #245c3a 48px 96px); border: 2px solid var(--line); }
.lineup canvas { width: 70px; height: 70px; }
.lede { font-family: var(--display); font-size: clamp(16px, 3.4vw, 24px); line-height: 1.35; text-wrap: balance; }
.join-panel { align-self: stretch; }
.joinrow input { flex: 1 1 140px; letter-spacing: .25em; font-family: var(--display); font-size: 18px; text-transform: uppercase; }
.or { display: flex; align-items: center; gap: 10px; color: var(--mute); font-family: var(--display); font-size: 11px; text-transform: uppercase; }
.or::before, .or::after { content: ''; flex: 1; height: 2px; background: var(--line); }
.how ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; color: var(--mute); }
.how li b { color: var(--chalk); }

/* draft */
.draft { display: grid; gap: 16px; }
.dr-head { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.dr-round { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dr-round b { font-family: var(--display); font-size: 34px; color: var(--flag); line-height: 1; }
.dr-round .of { color: var(--mute); font-family: var(--display); font-size: 12px; }
.dr-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dr-title h2 { font-family: var(--display); font-size: clamp(14px, 3vw, 20px); text-transform: uppercase; letter-spacing: .04em; }
.pos-tag { font-family: var(--display); background: var(--flag); color: #1a1405; padding: 5px 8px; font-size: 13px; }
.dr-ovr { display: grid; justify-items: end; gap: 2px; }
.dr-ovr b { font-family: var(--display); font-size: 28px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.pcard { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 12px; background: var(--panel); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 2px; min-width: 0; }
.pcard:hover { border-color: var(--flag); transform: translateY(-2px); }
.pcard:active { transform: translateY(1px); }
.pc-art { position: relative; display: grid; place-items: center; padding: 10px; background: repeating-linear-gradient(90deg, #1f5233 0 32px, #245c3a 32px 64px); min-height: 116px; }
.pc-art canvas { width: 98px; height: 98px; }
.pc-art .grade { position: absolute; top: 6px; right: 6px; }
.pc-main { display: grid; gap: 8px; min-width: 0; flex: 1; }
.pc-top { display: flex; align-items: center; gap: 8px; }
.key { font-family: var(--display); font-size: 11px; width: 22px; height: 22px; display: inline-grid; place-items: center; background: var(--panel2); border: 2px solid var(--line); flex: none; }
.pc-name { font-family: var(--display); font-size: 15px; text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dex { color: var(--mute); font-family: var(--display); font-size: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; gap: 4px; }
.st { display: grid; grid-template-columns: 34px 1fr 28px; gap: 8px; align-items: center; font-family: var(--display); font-size: 10px; color: var(--mute); }
.st b { color: var(--chalk); font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--ink); display: block; }
.bar i { display: block; height: 100%; }
.bar i.hi { background: var(--good); }
.bar i.mid { background: var(--tb); }
.bar i.lo { background: #6b7799; }
.fit { display: flex; align-items: center; gap: 8px; padding-top: 4px; border-top: 2px solid var(--line); }
.fit .lbl { font-family: var(--display); font-size: 10px; color: var(--mute); }
.fit b { font-family: var(--display); font-size: 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.meter { display: flex; gap: 2px; flex: 1; }
.meter i { height: 10px; flex: 1; background: var(--ink); }
.meter i.on { background: var(--flag); }
.dr-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.keys { color: var(--mute); font-size: 16px; }
.dr-actions .ghost { margin-left: auto; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.slot { display: grid; justify-items: center; gap: 2px; padding: 4px 2px; background: var(--panel); border: 2px solid var(--line); min-height: 52px; }
.slot.cur { border-color: var(--flag); }
.slot.done { background: var(--panel2); }
.s-lbl { font-family: var(--display); font-size: 9px; color: var(--mute); }
.slot canvas { width: 28px; height: 28px; }
.slot .empty { width: 24px; height: 24px; display: block; }

/* setup + review + wait */
.setup, .review, .wait { max-width: 720px; margin: 0 auto; width: 100%; }
.forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.segs { display: flex; margin-block: 8px; }
.seg { flex: 1; font-family: var(--display); font-size: 13px; padding: 12px 8px; background: var(--ink); border: 2px solid var(--line); color: var(--mute); text-transform: uppercase; }
.seg + .seg { border-left: 0; }
.seg.on { background: var(--flag); color: #1a1405; border-color: #a67d00; }
.ratings { display: flex; gap: 12px; flex-wrap: wrap; }
.ratings > div { flex: 1 1 90px; display: grid; gap: 2px; padding: 10px 12px; background: var(--ink); border: 2px solid var(--line); }
.ratings b { font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.ratings.small b { font-size: 18px; }
.ratings.small > div { padding: 6px 10px; }
.roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.roster li { display: grid; grid-template-columns: 38px 24px minmax(0, 1fr) auto 28px 24px; gap: 8px; align-items: center; padding: 3px 6px; background: var(--ink); }
.r-pos { font-family: var(--display); font-size: 10px; color: var(--mute); }
.roster canvas { width: 28px; height: 28px; }
.r-name { font-family: var(--display); font-size: 12px; text-transform: uppercase; overflow-wrap: anywhere; }
.r-type { font-family: var(--display); font-size: 9px; color: var(--tc); text-transform: uppercase; }
.r-fit { font-family: var(--display); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.roster .grade { width: 22px; height: 22px; font-size: 11px; }
.bigcode { font-family: var(--display); font-size: clamp(38px, 12vw, 72px); letter-spacing: .18em; color: var(--flag); line-height: 1; padding-block: 4px; }
.seats { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.seats li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--ink); border: 2px solid var(--line); color: var(--mute); }
.seats li.ok { border-color: var(--good); }
.seats li b { color: var(--chalk); font-weight: 600; font-size: 20px; overflow-wrap: anywhere; }
.dot { width: 12px; height: 12px; display: block; }

/* game */
.game { display: grid; gap: 14px; }
.sb { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.sb-team { display: grid; gap: 4px; padding: 10px 14px; background: var(--panel); border: 2px solid var(--line); border-top-width: 6px; align-content: center; min-width: 0; }
.sb-team.a { border-top-color: var(--ta); }
.sb-team.b { border-top-color: var(--tb); text-align: right; }
.sb-team.has { background: var(--panel2); }
.sb-team.has .sb-name::before { content: '◆ '; color: var(--flag); }
.sb-team.b.has .sb-name::before { content: ''; }
.sb-team.b.has .sb-name::after { content: ' ◆'; color: var(--flag); }
.sb-name { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.sb-score { font-family: var(--display); font-size: clamp(30px, 7vw, 46px); line-height: 1; font-variant-numeric: tabular-nums; }
.sb-mid { display: grid; gap: 4px; justify-items: center; align-content: center; padding: 8px 14px; background: var(--ink); border: 2px solid var(--line); text-align: center; min-width: 120px; }
.sb-q { font-family: var(--display); font-size: 12px; color: var(--flag); }
.sb-dd { font-family: var(--display); font-size: 16px; }
.sb-ball { color: var(--mute); font-size: 16px; }
.fieldhost { border: 3px solid var(--line); background: #0e1528; line-height: 0; }
canvas.field { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.deck { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cp-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.role { font-family: var(--display); font-size: 12px; text-transform: uppercase; padding: 5px 8px; letter-spacing: .05em; }
.role.off { background: var(--flag); color: #1a1405; }
.role.def { background: var(--tb); color: #07162a; }
.sit { font-family: var(--display); font-size: 12px; color: var(--mute); }
.calls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.call { display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; row-gap: 2px; text-align: left; padding: 10px; background: var(--panel2); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 2px; align-content: start; min-width: 0; }
.call:hover:not(:disabled) { border-color: var(--flag); }
.call:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.call:disabled { opacity: .4; cursor: not-allowed; }
.call .key { grid-row: span 2; }
.call b { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; font-weight: 400; }
.call small { color: var(--mute); font-size: 15px; line-height: 1.2; grid-column: 2; }
.call em { grid-column: 2; font-style: normal; font-family: var(--display); font-size: 10px; color: var(--flag); }
.locked { display: grid; gap: 6px; padding: 16px; background: var(--ink); border: 2px dashed var(--line); }
.locked b { font-family: var(--display); font-size: 20px; text-transform: uppercase; color: var(--flag); font-weight: 400; }
.side { display: grid; gap: 12px; min-width: 0; }
.banner { padding: 12px 14px; background: var(--panel); border: 2px solid var(--line); border-left: 8px solid var(--bc, var(--line)); display: grid; gap: 4px; }
.bn-meta { font-family: var(--display); font-size: 10px; letter-spacing: .06em; color: var(--mute); text-transform: uppercase; }
.bn-text { font-size: 21px; line-height: 1.2; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 5px 8px; background: var(--panel); font-size: 16px; line-height: 1.2; }
.log li.ev-td, .log li.ev-fg, .log li.ev-safety { background: var(--panel2); }
.lg-n { font-family: var(--display); font-size: 10px; padding-top: 3px; }
.final { display: grid; gap: 14px; text-align: center; justify-items: center; padding-block: 10px; }
.final h2 { font-size: clamp(24px, 6vw, 40px); color: var(--flag); }
.fscore { display: grid; gap: 6px; font-family: var(--display); font-size: 14px; text-transform: uppercase; }
.fscore b { font-size: 26px; margin-left: 8px; }

/* modal + toast */
#modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.m-back { position: absolute; inset: 0; background: rgba(5, 8, 18, .8); }
.m-card { position: relative; background: var(--panel); border: 2px solid var(--line); padding: 18px; max-width: 920px; width: 100%; max-height: 88vh; overflow-y: auto; display: grid; gap: 14px; }
.m-card h3 { font-family: var(--display); font-size: 15px; text-transform: uppercase; }
.rcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.rcol { display: grid; gap: 10px; align-content: start; min-width: 0; }
.rcol.a h3 { color: var(--ta); }
.rcol.b h3 { color: var(--tb); }
.tbl-wrap { overflow-x: auto; }
.mt { border-collapse: collapse; width: 100%; min-width: 520px; }
.mt th, .mt td { padding: 8px; border: 2px solid var(--line); text-align: center; font-size: 16px; }
.mt thead th { font-family: var(--display); font-size: 10px; text-transform: uppercase; color: var(--mute); }
.mt tbody th { text-align: left; font-family: var(--display); font-size: 11px; text-transform: uppercase; }
.mt td { font-family: var(--display); font-size: 14px; }
.mt .good2 { background: rgba(95, 211, 141, .35); } .mt .good1 { background: rgba(95, 211, 141, .15); }
.mt .bad2 { background: rgba(255, 107, 107, .35); } .mt .bad1 { background: rgba(255, 107, 107, .15); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chalk); color: #10152a; padding: 12px 16px; font-size: 18px; font-weight: 600; max-width: min(92vw, 520px); z-index: 30; border-bottom: 5px solid var(--flag); }
.toast[hidden] { display: none; }

/* narrow screens */
@media (max-width: 760px) {
  .lobby { grid-template-columns: minmax(0, 1fr); }
  .deck { grid-template-columns: minmax(0, 1fr); }
  .rcols { grid-template-columns: minmax(0, 1fr); }
  .dr-head { grid-template-columns: auto 1fr; }
  .dr-ovr { display: none; }
}
@media (max-width: 640px) {
  .cards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pcard { flex-direction: row; gap: 12px; }
  .pc-art { min-height: 0; align-self: flex-start; padding: 6px; }
  .pc-art canvas { width: 70px; height: 70px; }
  .sb { grid-template-columns: 1fr 1fr; }
  .sb-mid { grid-column: 1 / -1; order: -1; grid-auto-flow: column; justify-content: space-between; min-width: 0; }
  .roster li { grid-template-columns: 34px 24px minmax(0, 1fr) 26px 22px; }
  .r-type { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pcard, .btn, .call { transition: none; }
  .pcard:hover { transform: none; }
}

/* gridiron additions */
.pc-art.units { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; align-content: center; }
.pc-art.units canvas { width: 42px; height: 42px; }
.plist { display: grid; gap: 1px; font-size: 14px; color: var(--mute); }
.plist div { display: flex; justify-content: space-between; gap: 8px; }
.plist b { color: var(--chalk); font-weight: 600; }
.chip.tm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dex { font-family: var(--display); font-size: 18px; color: var(--chalk); }
@media (max-width: 640px) { .pc-art.units canvas { width: 28px; height: 28px; } }

/* ---------- hub: menus, franchise screens, leagues, tournaments ---------- */
.mast { align-items: center; }
#hdr-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 4px; }
.tile { text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 6px; align-content: start; min-height: 130px; }
.tile:hover { border-color: var(--flag); background: var(--panel2); }
.tile b { font-family: var(--display); font-size: 17px; letter-spacing: .04em; color: var(--flag); }
.tile span { color: var(--chalk); font-size: 17px; }
.lockt { font-style: normal; font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .08em; }
.panel.narrow { max-width: 560px; margin-inline: auto; width: 100%; }
.panel h3 { font-family: var(--display); font-size: 14px; letter-spacing: .05em; margin-bottom: 8px; }
.row.between { justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.sub.bad, .bad { color: var(--bad); }
select, input[type=number], input[type=password] { background: var(--ink); color: var(--chalk); border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; max-width: 100%; }
input[type=password] { width: 100%; }
select:focus, input:focus { border-color: var(--flag); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.segs { display: flex; flex-wrap: wrap; gap: 0; margin: 4px 0 8px; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 16px; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.addrow input[type=text], .addrow select { flex: 1 1 200px; }
.lglist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
.lglist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.lglist li div { display: grid; }

/* ---------- field renderer ---------- */
const Field = {
  W: 680, H: 372, YPP: 20, TOP: 42,
  cv: null, ctx: null, scene: null, cam: 50, ballX: null, ballLift: 0, flash: null,
  queue: [], busy: false,
  init() {
    if (this.cv) return;

    cv.width = this.W; cv.height = this.H; cv.className = 'field';
    cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Football field');
    this.cv = cv; this.ctx = cv.getContext('2d');
  },
  losX(sc) { return sc.poss === 'a' ? sc.ballOn : 100 - sc.ballOn; },
  clampCam(x) { const half = this.W / this.YPP / 2; return Math.max(-10 + half, Math.min(110 - half, x)); },
  set(sc) { this.scene = sc; this.cam = this.clampCam(this.losX(sc)); this.ballX = null; this.ballLift = 0; this.flash = null; this.draw(); },
  formation(sc) {
    const o = sc.poss, d = other(o), dir = o === 'a' ? 1 : -1, los = this.losX(sc);
    const midY = this.TOP + (this.H - this.TOP) / 2, ROW = 24;
    const out = [], OS = sc.teams[o].squad, DS = sc.teams[d].squad;
    const put = (team, wx, sy, base) => out.push({ wx, sy, key: fieldKey(base, team), team });
    const sk = p => p.sk + ':' + p.hr + ':000000:000000';
    const OFFP = [[OS.qb, 3, 0], [OS.hb, 7, 0], [OS.wr[0], 0.7, -5.2], [OS.wr[1], 0.7, 5.2], [OS.te, 0.7, 3]];
    OFFP.forEach(q => put(o, los - dir * q[1], midY + q[2] * dir * ROW, sk(q[0])));
    const gt = ab => ({ abbr: ab, c1: '#222222', c2: '#222222' });
    [-2, -1, 0, 1, 2].forEach((yy, n) => put(o, los - dir * 0.7, midY + yy * dir * ROW, genericKey(gt(OS.ol.tm), 'OL', n)));
    const T43 = { LDE: [-0.9, -2.9], LDT: [-0.9, -1], RDT: [-0.9, 1], RDE: [-0.9, 2.9], WLB: [-3, -3.6], MLB: [-3.8, 0], SLB: [-3, 3.6] };
    const T34 = { LDE: [-0.9, -2.2], NT: [-0.9, 0], RDE: [-0.9, 2.2], WLB: [-2.6, -3.8], LILB: [-3.6, -1.1], RILB: [-3.6, 1.1], SLB: [-2.6, 3.8] };
    const TD = Object.assign({}, DS.df.sch === '43' ? T43 : T34, { LCB: [-2.2, -6], RCB: [-2.2, 6], SS: [-9, 2.2], FS: [-9, -2.2] });
    DS.df.p.forEach((p, n) => {
      const q = TD[p[0]]; if (!q) return;
      put(d, los - dir * q[0], midY + q[1] * dir * ROW, genericKey(gt(DS.df.tm), 'DEF', n));
    });
    out.sort((a, b) => a.sy - b.sy);
    return out;
  },

  draw() {
    const x = this.ctx, W = this.W, H = this.H, YPP = this.YPP, TOP = this.TOP, sc = this.scene;
    if (!x) return;
    x.imageSmoothingEnabled = false;
    x.clearRect(0, 0, W, H);
    x.fillStyle = '#0e1528'; x.fillRect(0, 0, W, H);
    if (!sc) return;
    const left = this.cam - W / YPP / 2, sx = wx => (wx - left) * YPP;
    for (let yd = -10; yd < 110; yd += 5) {
      const a = sx(yd), b = sx(yd + 5);
      if (b < 0 || a > W) continue;
      x.fillStyle = yd < 0 ? '#6b2a1e' : yd >= 100 ? '#1b4a80' : (((yd / 5) | 0) % 2 === 0 ? '#1f5233' : '#245c3a');

    for (let yd = 0; yd <= 100; yd += 5) {
      const px = Math.round(sx(yd)); if (px < -20 || px > W + 20) continue;

      x.fillStyle = 'rgba(239,233,214,.5)'; x.font = '22px Silkscreen, monospace';

    });
    // scrimmage + first down lines
    const los = this.losX(sc), dir = sc.poss === 'a' ? 1 : -1;
    const fd = Math.max(-0.01, Math.min(100.01, los + dir * sc.toGo));
    x.fillStyle = '#5aa9ff'; x.fillRect(Math.round(sx(los)) - 1, TOP, 3, H - TOP);
    x.fillStyle = '#ffcf3f'; x.fillRect(Math.round(sx(fd)) - 1, TOP, 3, H - TOP);
    // players
    this.formation(sc).forEach(p => {
      const px = Math.round(sx(p.wx)); if (px < -20 || px > W + 20) return;
      x.fillStyle = TEAM_COL[p.team]; x.globalAlpha = 0.55;
      x.beginPath(); x.ellipse(px, p.sy + 9, 11, 4, 0, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
      const face = p.team === sc.poss ? dir : -dir, spx = Math.round(p.sy) - 21;
      if (face < 0) { x.save(); x.translate(px, 0); x.scale(-1, 1); x.drawImage(getSprite(p.key), -14, spx, 28, 28); x.restore(); }

    });
    // ball
    const bx = this.ballX == null ? los - dir * 0.2 : this.ballX;
    const by = TOP + (H - TOP) / 2 - this.ballLift;
    x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.ellipse(sx(bx), TOP + (H - TOP) / 2 + 8, 6, 2.5, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#8a4b22'; x.beginPath(); x.ellipse(sx(bx), by, 6, 3.6, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#efe9d6'; x.fillRect(Math.round(sx(bx)) - 2, Math.round(by) - 1, 4, 1);

    x.fillStyle = 'rgba(74,168,255,.55)'; x.fillRect(mx + mw * 0.94, my, mw * 0.06, mh);
    x.fillStyle = 'rgba(239,233,214,.3)';
    for (let i = 1; i < 10; i++) x.fillRect(Math.round(mp(i * 10)), my, 1, mh);
    x.strokeStyle = 'rgba(239,233,214,.8)'; x.lineWidth = 1;
    const vl = mp(left), vr = mp(left + W / YPP);
    x.strokeRect(vl + 0.5, my - 2.5, Math.max(4, vr - vl), mh + 5);
    x.fillStyle = TEAM_COL[sc.poss]; x.fillRect(Math.round(mp(los)) - 2, my - 1, 5, mh + 2);
    x.fillStyle = '#ffcf3f'; x.fillRect(Math.round(mp(fd)) - 1, my - 1, 2, mh + 2);
    x.font = '10px Silkscreen, monospace'; x.textAlign = 'left';
    x.fillStyle = '#93a0c4'; x.fillText(abbr(sc.teams.a.name), mx, my + mh + 12);
    x.textAlign = 'right'; x.fillText(abbr(sc.teams.b.name), mx + mw, my + mh + 12);
    // flash text
    if (this.flash) {
      x.textAlign = 'center'; x.font = '34px Silkscreen, monospace';
      x.lineWidth = 6; x.strokeStyle = '#0b1020'; x.strokeText(this.flash.text, W / 2, H / 2 - 8);
      x.fillStyle = this.flash.color; x.fillText(this.flash.text, W / 2, H / 2 - 8);
    }
  },
  enqueue(entry, teams) { this.queue.push({ entry, teams }); if (!this.busy) this.next(); },
  next() {
    const job = this.queue.shift();

    this.play(job.entry, job.teams, () => this.next());
  },
  play(entry, teams, done) {
    const b = entry.before, dir = b.poss === 'a' ? 1 : -1, los = b.poss === 'a' ? b.ballOn : 100 - b.ballOn;
    this.scene = { poss: b.poss, ballOn: b.ballOn, down: b.down, toGo: b.toGo, teams };
    const kind = entry.anim;
    let endX = los + dir * entry.travel;
    if (kind === 'fg') endX = dir === 1 ? 104 : -4;
    endX = Math.max(-9, Math.min(109, endX));
    const lift = kind === 'punt' ? 80 : kind === 'fg' ? 70 : (kind === 'pass' || kind === 'int' || kind === 'inc') ? 46 : 0;
    const dur = kind === 'punt' || kind === 'fg' ? 1200 : (kind === 'pass' || kind === 'int' || kind === 'inc') ? 900 : 760;
    const startX = los - dir * (kind === 'punt' || kind === 'fg' ? 7 : 3);
    const FL = {
      td: ['TOUCHDOWN', entry.ptsTeam], fg: ['FIELD GOAL', entry.ptsTeam], fgmiss: ['NO GOOD', null],
      int: ['INTERCEPTED', other(b.poss)], sack: ['SACK', other(b.poss)], fumble: ['FUMBLE', other(b.poss)],
      downs: ['TURNOVER ON DOWNS', other(b.poss)], safety: ['SAFETY', entry.ptsTeam]
    };
    const fl = FL[entry.ev] || (entry.firstDown ? ['FIRST DOWN', b.poss] : null);
    const after = { poss: entry.after.poss, ballOn: entry.after.ballOn, down: entry.after.down, toGo: entry.after.toGo, teams };
    const t0 = performance.now(), hold = fl ? 750 : 220, settle = 320;
    let finished = false;
    const finish = () => { if (finished) return; finished = true; this.flash = null; this.set(after); done(); };
    const camStart = this.cam;
    const step = t => {
      if (finished) return;
      const el = t - t0;
      if (el < dur) {
        const p = el / dur, e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        this.ballX = startX + (endX - startX) * e;
        this.ballLift = lift ? Math.sin(Math.PI * e) * lift : 0;
        this.cam = this.clampCam(los + (endX - los) * e * 0.8);
      } else if (el < dur + hold) {
        this.ballX = endX; this.ballLift = 0;
        if (fl && !this.flash) this.flash = { text: fl[0], color: fl[1] ? TEAM_COL[fl[1]] : '#efe9d6' };
      } else if (el < dur + hold + settle) {
        if (this.scene !== after) { this.scene = after; this.ballX = null; this.flash = null; this.cam0 = this.cam; }
        const p = (el - dur - hold) / settle, target = this.clampCam(this.losX(after));
        this.cam = this.cam0 + (target - this.cam0) * p;
      } else { finish(); return; }
      this.draw();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(finish, dur + hold + settle + 1800);
  }
};

/* ---------- server api (Vercel function + Redis) ---------- */
async function api(body, ep) {
  const h = { 'content-type': 'application/json' };
  const tk = window.HUB && window.HUB.token; if (tk) h['x-token'] = tk;
  const r = await fetch('/api/' + (ep || 'room'), { method: 'POST', headers: h, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((j && j.error) || 'http ' + r.status); err.code = (j && j.error) || 'http'; err.status = r.status; throw err; }
  return j;
}

async function sdPick(cid) {
  const sd = S.sd; if (!sd || sd.busy) return;
  const err = DR.legal(sd.d, sd.me, cid); if (err) { toast(err); return; }
  sd.busy = true; sdUpdate();

    if (sd.post) sdSet(await sd.post(cid)); else DR.apply(sd.d, sd.me, cid);
  } catch (e) { toast(e.code === 'illegal' || e.code === 'taken' ? 'That pick is not available. The board has been refreshed.' : e.code === 'turn' ? 'It is not your turn yet.' : 'Could not draft that player. Try again.'); if (sd.poll) { try { sdSet(await sd.poll()); } catch (e2) {} } }

function sdAfter() {

}
function sdStep() {
  const sd = S.sd; if (!sd || DR.isDone(sd.d) || sd.timer) return;
  const t = DR.onClock(sd.d);
  if (sd.localCpu && sd.cpu[t]) {
    sd.timer = setTimeout(() => { sd.timer = 0; if (S.sd !== sd || DR.isDone(sd.d) || DR.onClock(sd.d) !== t) return; DR.apply(sd.d, t, DR.cpuPick(sd.d, t)); sdAfter(); }, 650);
  } else if (sd.auto && t === sd.me && !sd.busy) {
    sd.timer = setTimeout(() => { sd.timer = 0; if (S.sd === sd && DR.onClock(sd.d) === sd.me) sdPick(DR.cpuPick(sd.d, sd.me)); }, 450);
  }
}
function sdPollLoop() {
  const sd = S.sd; if (!sd || !sd.poll) return;
  sd.pollT = setTimeout(async () => {
    sd.pollT = 0; if (S.sd !== sd) return;
    try { if (!sd.busy) { const ch = sdSet(await sd.poll()); if (ch) { sdAfter(); if (S.sd !== sd) return; } } } catch (e) {}
    if (S.sd === sd) sdPollLoop();

}
function sdFinish() {

  if (sd.pollT) { clearTimeout(sd.pollT); sd.pollT = 0; }
  if (S.mode === 'local' && sd.localCpu) {
    ['a', 'b'].forEach((seat, t) => { S.seats[seat] = { pid: t === sd.me ? PID : 'cpu', name: sd.names[t], status: 'ready', roster: DR.toRoster(DR.teamIds(sd.d, t)) }; });
    S.sd = null; S.screen = null; render(); return;
  }
  if (S.mode === 'sdraft') {

}

const tbl = (head, rows) => '<div class="tbl-wrap"><table class="tb"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
function teamOvr(L, tid) { const r = LG.teamRating(L, tid); return r; }

function gameLine(L, g, tid) {

  async list() {

    for (let i = 1; i <= 3; i++) { let m = null; try { m = JSON.parse(lsGet('gd_cm' + i)); } catch (e) {} out.push(m ? Object.assign({ slot: i }, m) : { slot: i, empty: true }); }

    return JSON.parse(lsGet('gd_c' + slot));

  async put(slot, L) {
    if (H.user) { await call('save', { op: 'put', slot, L }); return; }
    if (!lsSet('gd_c' + slot, JSON.stringify(L)) || !lsSet('gd_cm' + slot, JSON.stringify(SAVE.meta(L)))) throw new Error('This device ran out of storage. Sign in to save online.');

function campAdapter() {
  const L = C.L, tid = L.user;
  const after = (now) => { campDirty(now); frShow(campAdapter()); };
  return {
    kind: 'campaign', L, tid, title: 'Campaign', canAdvance: true, canEditRoster: () => true, status: savedText(),
    headBtns: '<button class="btn small" data-h="camp-exit">Save &amp; exit</button>',
    cpuOffers: async () => LG.cpuOffers(L, tid),
    async act(op, a) {
      let r = { ok: true };
      if (op === 'trade') {
        if (!LG.canTrade(L)) r = { ok: false, msg: 'Trading is closed right now.' };
        else { const x = LG.cpuTrade(L, tid, a.to, a.give, a.get); if (x.ok) LG.doTrade(L, tid, a.to, a.give, a.get); r = { ok: x.ok, msg: x.msg }; }
      } else if (op === 'sign') { const e = LG.signFA(L, tid, a.pid); r = { ok: !e, msg: e || 'Signed.' }; }
      else if (op === 'release') { const e = LG.release(L, tid, a.pid); r = { ok: !e, msg: e || 'Released.' }; }
      else if (op === 'draft') {
        if (!LG.draftPick(L, tid, a.pid)) r = { ok: false, msg: 'That pick is not allowed.' };
        else { LG.autoDraftToHuman(L); }
      } else if (op === 'draftauto') { L.draft.auto = L.draft.auto || {}; L.draft.auto[tid] = !!a.on; LG.autoDraftToHuman(L); }
      if (!r.ok && r.msg) toast(r.msg);
      after(op === 'draft' && L.phase !== 'draft'); return r;
    },
    async go(op) {
      if (op === 'offseason') { LG.offseasonBegin(L, 7); FR.tab = L.phase === 'draft' ? 'draft' : 'home'; }
      else if (op === 'season') { LG.startSeason(L); LG.runUntilHuman(L, 60); FR.tab = 'home'; }
      else if (op === 'trim') LG.trimRoster(L, tid);
      after(true);
    },
    async sim(gid) { const g = L.sched.find(x => x.id === gid); if (!g || g.done) return; LG.simGame(L, g); LG.runUntilHuman(L, 60); LG.checkFinal(L); after(true); },
    async play(gid) {
      const g = L.sched.find(x => x.id === gid); if (!g || g.done) return;
      g.T = LG.teamsFor(L, g.h, g.a);
      const side = g.h === tid ? 'a' : 'b', cpuSide = side === 'a' ? 'b' : 'a';
      G.startCtxCpu({ seed: LG.gameSeed(L, g), T: g.T, side, cpuSide }, {
        label: g.pl === 'po' ? 'Playoffs' : 'Week ' + g.w,
        report: async moves => { if (!LG.playVerified(L, g, moves, [cpuSide])) throw new Error('The game did not finish.'); },
        onDone: () => { LG.runUntilHuman(L, 60); LG.checkFinal(L); campDirty(true); go('camphub'); }
      });
    }
  };
}

function lgAdapter() {
  const L = LGS.L, me = H.user, mgr = LGS.mgr === me, t = L.teams.find(x => x.owner === me), tid = t ? t.id : -1;
  const A = {
    kind: 'league', L, tid, title: L.cfg.name + ' · ' + LGS.code, canAdvance: mgr,
    canEditRoster: () => tid >= 0 && L.phase !== 'draft' && L.phase !== 'setup',
    waitMsg: 'Waiting on the other managers\' games.',
    headBtns: '<button class="btn small" data-h="copy" data-code="' + LGS.code + '">Code ' + LGS.code + '</button><button class="btn small" data-h="leagues">All leagues</button>',
    tabs: [{ id: 'lg', label: 'League', html: () => lgPanel(A) }],
    cpuOffers: async () => { const r = await run(() => call('league', { op: 'cpuoffers', code: LGS.code })); return r ? r.offers : []; },
    act: (op, a) => lgOp(op, a),
    go: async op => { await lgOp(op); if (op === 'offseason') FR.tab = 'draft'; if (op === 'season') FR.tab = 'home'; },
    sim: gid => lgOp('simme', { gid }),
    async play(gid) {
      const info = await run(() => call('league', { op: 'play', code: LGS.code, gid })); if (!info) return;
      const report = async moves => {
        try { await call('league', { op: 'report', code: LGS.code, gid, moves: moves || undefined }); }
        catch (e) { const r = await call('league', { op: 'get', code: LGS.code }); const g = r.L.sched.find(x => x.id === gid); if (!(g && g.done)) throw e; }
      };
      const ctx = { label: info.homeName + ' – ' + info.awayName, report, onDone: () => { lgLoad(LGS.code, true).then(() => go('league', { code: LGS.code })); go('league', { code: LGS.code }); } };
      if (info.room) G.startCtxRoom({ room: info.room, seed: info.seed, side: info.side }, ctx);
      else G.startCtxCpu(info, ctx);
    },
    draftBtns: () => mgr ? '<button class="btn" data-h="lg-skip">Pick for the team on the clock</button><button class="btn" data-h="lg-autoall">Auto-draft everyone left</button>' : ''
  };
  return A;
}

      '<div class="row">' + (c.teamMode === 'draft' ? '<button class="btn ' + (T.drafted ? '' : 'primary') + '" data-h="tn-sdraft">' + (T.drafted ? 'Redo the draft' : 'Start the draft') + '</button>' : '') + '<button class="btn primary" data-h="tn-start"' + (c.teamMode === 'draft' && !T.drafted ? ' disabled' : '') + '>Start the tournament</button></div></section>';
  }
  return h;
}
const _seg0 = ACT.seg;
ACT.seg = t => { if (H.view === 'tourney') { tnOp('cfg', { cfg: { [t.dataset.k]: parseV(t.dataset.v) } }); } else _seg0(t); };
ACT['tn-join'] = () => tnOp('join');
ACT['tn-leave'] = () => { if (confirm('Leave this tournament?')) tnOp('leave').then(r => { if (r) go('tourneys'); }); };
ACT['tn-del'] = () => { if (confirm('Delete this tournament for everyone?')) tnOp('delete'); };
ACT['tn-pick'] = () => tnOp('pick', { abbr: $('#tn-fr').value });
ACT['tn-cpu'] = t => tnOp('addcpu', { n: +t.dataset.n });
ACT['tn-rm'] = t => tnOp('rm', { id: t.dataset.id });
ACT['tn-auto'] = t => {
  if (t.dataset.m === 'join') { tnOp('seeds', { order: TNS.T.ent.map(e => e.id) }); return; }
  tnOp('autoseed', { mode: t.dataset.m });
};
ACT['tn-mv'] = t => {
  const T = TNS.T, ord = (T.seeds.length === T.ent.length ? T.seeds : T.ent.map(e => e.id)).slice(), i = +t.dataset.i, j = i + +t.dataset.d;
  const x = ord[i]; ord[i] = ord[j]; ord[j] = x; tnOp('seeds', { order: ord });
};
ACT['tn-start'] = async () => { const r = await tnOp('start'); if (r) toast('The tournament has started.'); };
ACT['tn-rename'] = () => tnOp('team', { name: $('#tn-tname').value });
ACT['tn-sdraft'] = async () => {
  if (TNS.T.drafted && !confirm('Throw out the current teams and draft again?')) return;
  if (await tnOp('startdraft')) toast('The draft has started.');
};
ACT['tn-dskip'] = () => tnOp('dauto');
ACT['tn-dall'] = () => { if (confirm('Auto-draft the rest of the board for everyone?')) tnOp('dauto', { all: true }); };
ACT['tn-dcancel'] = () => { if (confirm('Cancel the draft?')) tnOp('dcancel'); };
ACT['tn-board'] = () => {
  const T = TNS.T, dr = T.dr, mine = T.ent.find(e => e.owner === H.user), code = TNS.code;
  if (!dr || T.phase !== 'drafting') { toast('There is no draft running.'); return; }
  const fetchD = async () => {
    const r = await call('tourney', { op: 'get', code, ver: 0 }); TNS.T = r.T; TNS.ver = r.ver;
    if (!r.T.dr || (r.T.phase === 'setup' && !r.T.drafted)) { G.exitToHub(); go('tourney', { code }); toast('The draft was canceled.'); return null; }
    return r.T.dr.d;
  };
  G.startBoard({
    label: c0(T), d: dr.d, me: mine ? dr.order.indexOf(mine.id) : 0, watch: !mine, names: dr.order.map(id => entName(T, id).name), poll: fetchD,
    post: async cid => { await call('tourney', { op: 'dpick', code, id: cid }); return fetchD(); },
    onDone: () => { G.exitToHub(); go('tourney', { code }); toast('Draft complete. Your team is set.'); }
  });
};
const c0 = T => T.cfg.name + ' draft';
function tnDraftPanel(T, me, mgr, mine) {
  const dr = T.dr, d = dr.d, clock = DR.onClock(d);
  const nm = t => esc(entName(T, dr.order[t]).name);
  let h = '<section class="panel"><h3>The draft is live</h3><p class="sub">' + (DR.isDone(d) ? 'Finishing up…' : 'Pick ' + (d.picks.length + 1) + ' of ' + d.order.length + ' · on the clock: <b>' + nm(clock) + '</b>' + (entName(T, dr.order[clock]).owner === me ? ' (you)' : '')) + '</p>' +
    '<ol class="ordlist">' + dr.order.map((id, t) => { const e = entName(T, id), n = DR.teamIds(d, t).length; return '<li><span class="seedn">' + (t + 1) + '</span><span class="nm">' + entLabel(T, id, me) + '</span><span class="sub">' + n + ' / 7 picks' + (d.cap ? ' · $' + Math.round(DR.spent(DR.teamIds(d, t))) + 'M' : '') + (e.auto ? ' · auto' : '') + '</span></li>'; }).join('') + '</ol>' +
    '<div class="row">' + (mine ? '<button class="btn primary" data-h="tn-board">Open the draft board</button>' : '') + (mgr ? '<button class="btn small" data-h="tn-dskip">Auto-pick for whoever is on the clock</button><button class="btn small" data-h="tn-dall">Auto-draft everything left</button><button class="btn small ghost" data-h="tn-dcancel">Cancel draft</button>' : '') + '</div></section>';
  return h;
}

/* bracket */
function tnBracket(T, me, mgr, mine) {
  const br = T.br, rounds = [];
  for (let r = 1; r <= br.rounds; r++) rounds.push(br.matches.filter(m => m.r === r));
  const rname = r => LG.ROUND_NAMES(br.rounds - r + 1);
  let h = '<section class="panel"><h3>Bracket</h3><div class="bracket">';
  rounds.forEach((ms, ri) => {
    h += '<div class="bround"><h4>' + rname(ri + 1) + '</h4>';
    ms.forEach(m => {
      const A = m.a != null ? T.seeds[m.a] : null, B = m.b != null ? T.seeds[m.b] : null;
      const live = m.a != null && m.b != null && m.win == null;
      const row = (id, idx, wins) => '<div class="bt' + (m.win != null && m.win === (idx ? m.b : m.a) ? ' won' : '') + (entName(T, id) && entName(T, id).owner === me ? ' mine' : '') + '"><span class="bs">' + (idx ? (m.b != null ? m.b + 1 : '') : (m.a != null ? m.a + 1 : '')) + '</span><span class="bn">' + (id ? entLabel(T, id, me) : (m.bye ? '<span class="sub">bye</span>' : '<span class="sub">TBD</span>')) + '</span><b class="bw">' + (m.bye ? '' : wins) + '</b></div>';
      h += '<div class="bm' + (live ? ' live' : '') + '">' + row(A, 0, m.w[0]) + row(B, 1, m.w[1]) + (m.bye ? '' : '<div class="bmeta">' + (m.bo > 1 ? 'Best of ' + m.bo : 'One game') + (m.games.length ? ' · ' + m.games.map(g => g[0] + '-' + g[1]).join(', ') : '') + '</div>');
      if (live) {
        const EA = entName(T, A), EB = entName(T, B), inIt = mine && (EA === mine || EB === mine), oppCpu = inIt && ((EA === mine ? EB : EA).kind === 'cpu'), act = [];
        if (inIt) { act.push('<button class="btn small primary" data-h="tn-play" data-mid="' + m.id + '">Play game ' + (m.games.length + 1) + '</button>'); if (oppCpu) act.push('<button class="btn small" data-h="tn-simme" data-mid="' + m.id + '">Sim it</button>'); }
        if (mgr) { act.push('<button class="btn small ghost" data-h="tn-simm" data-mid="' + m.id + '">Sim game</button><button class="btn small ghost" data-h="tn-win" data-mid="' + m.id + '" data-side="0">Top wins</button><button class="btn small ghost" data-h="tn-win" data-mid="' + m.id + '" data-side="1">Bottom wins</button>'); }
        h += '<div class="bact">' + act.join('') + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  });
  return h + '</div></section>';
}
ACT['tn-simme'] = t => tnOp('simme', { mid: t.dataset.mid });
ACT['tn-simm'] = t => tnOp('simmatch', { mid: t.dataset.mid });
ACT['tn-win'] = t => { if (confirm('Set this series winner by hand?')) tnOp('override', { mid: t.dataset.mid, side: +t.dataset.side }); };
ACT['tn-play'] = async t => {
  const mid = t.dataset.mid, code = TNS.code;
  const info = await run(() => call('tourney', { op: 'play', code, mid })); if (!info) return;
  const report = async moves => {
    try { await call('tourney', { op: 'report', code, mid, moves: moves || undefined }); }
    catch (e) { const r = await call('tourney', { op: 'get', code }); const m = r.T.br.matches.find(x => x.id === mid); if (!(m && (m.games.length > info.k || m.win != null))) throw e; }
  };
  const ctx = { label: info.homeName + ' – ' + info.awayName, report, onDone: () => { TNS.ver = 0; go('tourney', { code }); } };
  if (info.room) G.startCtxRoom({ room: info.room, seed: info.seed, side: info.side }, ctx);
  else G.startCtxCpu(info, ctx);
};

/* ---------- boot hooks ---------- */
window.HUB = {
  get token() { return H.token; }, get user() { return H.user; },
  boot, show, renderHeader,
  ready() { G.resume(); }
};

})();
